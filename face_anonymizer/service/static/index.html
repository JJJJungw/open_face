<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>face-anonymizer</title>
<style>
  :root{
    /* 흰색 표면 + 파란색 강조. 상태색은 고정 팔레트를 쓰되, 밝은 표면에서는
       대비가 낮은 값이 있어 **글자는 항상 잉크 색**으로 두고 색은 점/테두리로만
       뜻을 거든다. */
    --bg:#f4f7fb; --surface:#ffffff; --raise:#eef4fc; --line:#e2e8f0;
    --fg:#0f172a; --dim:#526075; --faint:#94a3b8;
    --accent:#2a78d6;                     /* 흰 바탕 대비 4.3:1 */
    --accent-ink:#1c5aa8;                 /* 파란 글자용 (더 진한 단계) */
    --accent-dim:#e4eefb;                 /* 같은 램프의 밝은 단계 = 미터 트랙 */
    --accent-sel:#eff5fd;
    --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
    --critical-ink:#a82a2a; --critical-bg:#fdf1f1;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.04);
  }
  *{box-sizing:border-box}
  /* 브라우저 기본값 [hidden]{display:none} 은 우선순위가 0 이라 .card{display:flex}
     한 줄에 진다. 화면 전환이 hidden 으로 되어 있어서, 이게 없으면 '작업' 을
     눌러도 파일 브라우저가 그대로 남는다. */
  [hidden]{display:none !important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
            "Helvetica Neue","Apple SD Gothic Neo","Noto Sans KR",sans-serif}

  /* ── 뼈대 ───────────────────────────────────────────────────────────── */
  .app{display:grid;grid-template-columns:216px 1fr;height:100%}
  .side{background:var(--surface);border-right:1px solid var(--line);
        display:flex;flex-direction:column;min-height:0}
  .brand{padding:18px 18px 14px;font-size:14px;font-weight:600;
         letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .brand .mk{width:20px;height:20px;border-radius:6px;flex:none;
             background:linear-gradient(135deg,#2a78d6,#5b9dff)}
  nav{padding:4px 10px;flex:1;min-height:0;overflow:auto}
  nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
        color:var(--dim);text-decoration:none;font-size:13px;cursor:pointer}
  nav a:hover{background:var(--raise);color:var(--fg)}
  nav a.on{background:var(--accent-dim);color:var(--accent-ink);font-weight:600}
  nav .grp{font-size:10.5px;color:var(--faint);padding:14px 10px 5px;
           letter-spacing:.04em;text-transform:uppercase}
  /* 눌렀을 때 목록이 비어 있으면 아무 일도 안 일어난 것처럼 보인다.
     개수를 옆에 붙여 두면 무엇이 걸러지는지 누르기 전에 안다. */
  nav a .c{margin-left:auto;font-size:11px;color:var(--faint);
           font-variant-numeric:tabular-nums}
  nav a.on .c{color:var(--accent-ink)}
  /* 현황·로그에는 작업 목록이 없다. 그 화면에서 상태가 켜져 있으면 두 곳이
     동시에 선택된 것처럼 보이고, 정작 화면은 어느 쪽도 반영하지 않는다. */
  nav.nolist .st{opacity:.4}
  nav.nolist a.st:hover{opacity:1}

  main{min-width:0;overflow:auto;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:14px;padding:15px 24px;
       border-bottom:1px solid var(--line);position:sticky;top:0;
       background:rgba(255,255,255,.9);backdrop-filter:blur(8px);z-index:10}
  .top h1{font-size:16px;margin:0;font-weight:600;letter-spacing:-.01em;flex:1}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
         color:var(--dim);background:var(--surface);border:1px solid var(--line);
         border-radius:20px;padding:3px 11px;white-space:nowrap}
  .content{padding:20px 24px 32px;display:flex;flex-direction:column;gap:18px}

  /* ── KPI 타일 ───────────────────────────────────────────────────────── */
  .kpis{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:12px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;
        padding:15px 16px;min-width:0;box-shadow:var(--shadow)}
  .tile .lb{font-size:11.5px;color:var(--dim);margin-bottom:6px}
  .tile .v{font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
  .tile.hero{background:linear-gradient(180deg,#f7fbff,#ffffff);
             border-color:#cfe0f6}
  .tile.hero .lb{color:var(--accent-ink)}
  .tile.hero .v{font-size:44px;letter-spacing:-.03em;line-height:1.05;
                color:var(--accent-ink)}
  .tile .sub{font-size:11.5px;color:var(--faint);margin-top:5px}
  .tile .v small{font-size:14px;font-weight:500;color:var(--dim);margin-left:3px}

  /* ── 카드 ───────────────────────────────────────────────────────────── */
  .grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);
         gap:18px;align-items:start}
  .grid2.solo{grid-template-columns:minmax(0,1fr)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
        min-width:0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .card > h2{font-size:12.5px;margin:0;font-weight:600;color:var(--dim);
             padding:14px 16px;border-bottom:1px solid var(--line);
             display:flex;align-items:center;gap:9px}
  .card > h2 .cnt{margin-left:auto;font-weight:500;color:var(--faint);font-size:11.5px}
  /* 사이드바에서 무엇을 걸렀는지 목록 쪽에도 적는다. 왼쪽만 강조돼 있으면
     오른쪽 목록이 왜 짧아졌는지 연결이 안 된다. */
  .chip{display:inline-flex;align-items:center;gap:6px;margin-left:8px;
        background:var(--accent-dim);color:var(--accent-ink);border-radius:99px;
        padding:2px 6px 2px 9px;font-size:11px;font-weight:600}
  .chip b{cursor:pointer;font-size:13px;line-height:1;opacity:.7}
  .chip b:hover{opacity:1}
  /* ── 현황 ───────────────────────────────────────────────────────────── */
  .prow{padding:11px 0;border-bottom:1px solid #f1f5f9}
  .prow:last-child{border-bottom:0}
  .prow .t{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
  .prow .t b{font-weight:600}
  .prow .t span{margin-left:auto;color:var(--dim);font-size:11.5px;
                font-variant-numeric:tabular-nums}
  .track{height:7px;background:var(--accent-dim);border-radius:99px;
         overflow:hidden;margin-top:7px}
  .track>i{display:block;height:100%;background:var(--accent)}
  .track.full>i{background:var(--good)}
  .ops{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .ops div{background:var(--bg);border-radius:8px;padding:9px 11px}
  .ops span{display:block;color:var(--faint);font-size:10.5px;margin-bottom:3px}
  .ops b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .ops b small{font-size:11px;color:var(--dim);font-weight:500;margin-left:3px}
  .ops .wide{grid-column:1/-1}
  .ops .warnv b{color:var(--critical)}
  .card .pad{padding:14px 16px}

  /* ── S3 브라우저 ────────────────────────────────────────────────────── */
  .bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
       padding:12px 16px;border-bottom:1px solid var(--line)}
  .crumb{display:flex;align-items:center;gap:5px;font-size:12.5px;min-width:0;flex:1}
  .crumb a{color:var(--accent-ink);text-decoration:none;cursor:pointer;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb a:hover{text-decoration:underline}
  .crumb .sep{color:var(--faint);flex:none}
  .crumb .cur{color:var(--fg);font-weight:600;white-space:nowrap}
  .divider{width:1px;height:18px;background:var(--line);flex:none}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;
          color:var(--dim);cursor:pointer;white-space:nowrap;margin:0}
  .toggle:hover{color:var(--fg)}
  .toggle input{margin:0}
  .search{position:relative;flex:none}
  .search input{background:var(--bg);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:6px 10px 6px 26px;font-size:12.5px;width:170px}
  .search input:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-dim)}
  .search::before{content:'\2315';position:absolute;left:8px;top:5px;
                  color:var(--faint);font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{text-align:left;font-weight:600;font-size:11px;color:var(--faint);
           padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap;
           letter-spacing:.02em;background:#fafcfe}
  tbody td{padding:8px 16px;border-bottom:1px solid #f1f5f9}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#f8fbff}
  tbody tr.sel{background:var(--accent-sel)}
  td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim);
         white-space:nowrap}
  td.when{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
  .key{display:flex;align-items:center;gap:8px;min-width:0}
  .key .ico{flex:none;width:14px;text-align:center;color:var(--accent);font-size:11px}
  .key .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .key a{color:var(--accent-ink);text-decoration:none;cursor:pointer;font-weight:500}
  .key a:hover{text-decoration:underline}
  /* 상태 배지: 색은 점이 나르고 글자는 잉크 색으로 둔다 (밝은 표면 대비) */
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;
       padding:2px 8px;border-radius:20px;border:1px solid var(--line);
       color:var(--dim);white-space:nowrap;background:var(--surface)}
  .tag::before{content:'';width:5px;height:5px;border-radius:50%;
               background:var(--faint);flex:none}
  .tag.done{border-color:#bfe3bf}   .tag.done::before{background:var(--good)}
  .tag.run{border-color:#cfe0f6;color:var(--accent-ink)}
  .tag.run::before{background:var(--accent)}
  .tag.err{border-color:#f2c9c9;color:var(--critical-ink)}
  .tag.err::before{background:var(--critical)}
  .tag.warnt{border-color:#f5dda1;color:#8a6100}
  .tag.warnt::before{background:var(--warning)}
  .tag.plain::before{display:none}
  .empty{text-align:center;color:var(--faint);padding:38px 16px;font-size:12.5px}

  /* 상세 설정용 select 는 width:100% 라 바 안에서는 줄을 통째로 먹는다. */
  .bar select{width:auto;font-size:12px;padding:5px 8px}

  /* 로그 게시판. 표가 아니라 줄이다 — 한 줄이 사건 하나이고, 눈이 시각을 따라
     세로로 내려가야 해서 앞 세 칸의 폭을 고정한다. */
  .lrow{display:flex;align-items:baseline;gap:10px;padding:7px 16px;
        border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
  .lrow:hover{background:var(--accent-sel)}
  .lrow .lt{font-variant-numeric:tabular-nums;color:var(--faint);
            font-size:11.5px;width:60px;flex:none}
  .lrow .lm{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;
            color:var(--faint);border:1px solid var(--line);border-radius:4px;
            padding:0 4px;width:34px;text-align:center;flex:none}
  .lrow .lm.msa{color:var(--accent-ink);border-color:var(--accent)}
  .lrow .lb{width:64px;flex:none;font-weight:600;font-size:11.5px;
            display:flex;align-items:center;gap:5px}
  .lrow .lb::before{content:'';width:6px;height:6px;border-radius:50%;
                    background:var(--faint);flex:none}
  .lrow .lb.ok::before{background:var(--good)}
  .lrow .lb.bad::before{background:var(--critical)}
  .lrow .lb.warn::before{background:var(--warning)}
  .lrow .lb.run::before{background:var(--accent)}
  .lrow .ln{color:var(--fg);white-space:nowrap;overflow:hidden;
            text-overflow:ellipsis;max-width:300px}
  .lrow .lx{color:var(--dim);flex:1;min-width:0;overflow:hidden;
            text-overflow:ellipsis;white-space:nowrap}
  .lrow .lg2{color:var(--faint);font-size:11px;flex:none}
  /* 작업 단위로 묶었을 때의 머리줄. 게시판의 '글' 에 해당한다. */
  .lhead{display:flex;align-items:baseline;gap:9px;padding:9px 16px 6px;
         background:var(--raise);border-top:1px solid var(--line);
         font-size:12.5px;font-weight:600}
  .lhead .sub{font-weight:400;color:var(--dim);font-size:11.5px}
  .lhead .sub.bad{color:var(--critical-ink)}
  .lgroup .lrow{padding-left:28px;border-bottom:1px dashed var(--line)}
  /* 묶으면 파일명이 머리줄에 이미 있다. 줄마다 또 쓰면 눈이 그걸 읽느라 정작
     달라지는 값(사건·수치)을 늦게 찾는다. */
  .lgroup .lrow .ln{display:none}
  .pager{display:flex;align-items:center;justify-content:center;gap:12px;
         padding:14px 16px;border-top:1px solid var(--line);
         color:var(--dim);font-size:12.5px}
  .pager button[disabled]{opacity:.4;cursor:default}
  .pager input{width:52px;text-align:center;padding:4px 6px;font-size:12.5px;
               border:1px solid var(--line);border-radius:7px;background:var(--surface)}
  /* 위험한 동작은 목록 밖, 오른쪽 끝에 따로 둔다 — 카드의 '취소' 와 섞이면 안 된다 */
  .danger{border-color:#f2c9c9;color:var(--critical-ink)}
  .danger:hover{background:#fdf2f2}
  .confirm{display:inline-flex;align-items:center;gap:7px;font-size:12px;
           color:var(--critical-ink)}

  /* ── 큐 UI ──────────────────────────────────────────────────────────── */
  .flow{display:grid;grid-template-columns:1fr 26px 1fr 26px 1fr;align-items:stretch;
        gap:0;padding:4px 0 2px}
  .flow .box{border:1px solid var(--line);border-radius:11px;padding:13px 15px;
             background:var(--raise);min-width:0}
  .flow .box.mid{background:var(--accent-sel);border-color:#cfe0f6}
  .flow .lb{font-size:11px;color:var(--dim);letter-spacing:.02em}
  .flow .v{font-size:21px;font-weight:650;margin:3px 0 1px;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flow .sub{font-size:11.5px;color:var(--faint);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flow .arw{display:flex;align-items:center;justify-content:center;
             color:var(--faint);font-size:15px}
  .nextup{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;
          padding-top:12px;border-top:1px solid var(--line)}
  .nextup span{font-size:11.5px;color:var(--dim);background:var(--raise);
               border:1px solid var(--line);border-radius:7px;padding:3px 8px}
  .nextup .hd{background:none;border:none;color:var(--faint);padding-left:0}
  .bar .n{font-size:12.5px;color:var(--dim);margin-left:auto;white-space:nowrap}
  .bar .n b{color:var(--fg)}

  /* ── 폼 ─────────────────────────────────────────────────────────────── */
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:11px}
  details > summary{cursor:pointer;font-size:12px;color:var(--dim);
                    list-style:none;display:flex;align-items:center;gap:7px}
  details > summary::before{content:'▸';color:var(--faint);font-size:10px}
  details[open] > summary::before{content:'▾'}
  details > summary:hover{color:var(--accent-ink)}
  details > summary #dsum{color:var(--faint);font-size:11.5px}
  label{display:block;font-size:11px;color:var(--faint);margin-bottom:4px}
  select,input[type=number]{width:100%;background:var(--surface);color:var(--fg);
    border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px}
  select:focus,input[type=number]:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-dim)}
  .chk{display:flex;align-items:center;gap:7px;font-size:12.5px;padding-top:18px;
       color:var(--dim)}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;
    padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  button:hover:not(:disabled){background:var(--accent-ink)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:var(--surface);color:var(--dim);
               border:1px solid var(--line);font-weight:500}
  button.ghost:hover:not(:disabled){background:var(--raise);color:var(--accent-ink);
    border-color:#cfe0f6}
  input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}

  /* ── 작업 목록 ──────────────────────────────────────────────────────── */
  .job{padding:13px 16px;border-bottom:1px solid #f1f5f9}
  .job:last-child{border-bottom:0}
  .jhead{display:flex;align-items:baseline;gap:9px}
  /* 목록에서만 지우는 것이라 '삭제' 라고 쓰면 S3 원본을 지우는 것으로 읽힌다.
     라벨 없는 x 로 두고 설명은 툴팁에 둔다. */
  .jx{flex:none;border:0;background:none;cursor:pointer;padding:0 2px;
      font-size:15px;line-height:1;color:var(--faint)}
  .jx:hover{color:var(--critical)}
  .jname{font-weight:600;font-size:12.5px;overflow:hidden;
         text-overflow:ellipsis;white-space:nowrap;flex:1}
  .bar2{height:6px;background:var(--accent-dim);border-radius:99px;
        overflow:hidden;margin:9px 0 7px}
  .bar2>i{display:block;height:100%;background:var(--accent);width:0;
          border-radius:99px;transition:width .35s ease}
  .job.ok .bar2>i{background:var(--good)}
  .meta{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
  .stats div{background:var(--bg);border-radius:7px;padding:6px 8px}
  .kv{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .kv div{background:var(--bg);border-radius:7px;padding:6px 9px;min-width:0}
  .kv span{color:var(--faint);font-size:10.5px;margin-right:6px}
  .kv b{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
        white-space:nowrap;display:inline-block;max-width:340px;vertical-align:bottom}
  .stats span{display:block;color:var(--faint);font-size:10.5px}
  .stats b{font-size:12.5px;font-weight:600}
  .warn{background:var(--critical-bg);border:1px solid #f2c9c9;border-radius:8px;
        padding:9px 11px;margin-top:10px;color:var(--critical-ink);
        font-size:11.5px;line-height:1.5}
  .warn b{display:block;margin-bottom:2px}
  a.dl{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
       border-radius:7px;padding:6px 13px;font-weight:600;font-size:12px}
  a.dl:hover{background:var(--accent-ink)}
  .row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}

  /* ── 좌측 하단 상태 박스 ────────────────────────────────────────────── */
  .hud{border-top:1px solid var(--line);padding:13px 14px;flex:none;background:#fafcfe}
  .hud .hd{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .hud .hd h3{font-size:11.5px;margin:0;font-weight:600;flex:1;letter-spacing:-.01em}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .dot.ok{background:var(--good);box-shadow:0 0 0 3px rgba(12,163,12,.14)}
  .dot.run{background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);
           animation:pulse 1.5s ease-in-out infinite}
  .dot.err{background:var(--critical);box-shadow:0 0 0 3px rgba(208,59,59,.14)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .ringwrap{position:relative;display:flex;align-items:center;justify-content:center;

  .who .nm{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;

  .who .st{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .chip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;
        border:1px solid var(--line);color:var(--faint);margin-right:4px;

  .chip.on{color:var(--accent-ink);border-color:#cfe0f6;background:var(--accent-dim)}

  }
  @media (max-width:760px){ .app{grid-template-columns:1fr} .side{display:none} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mk"></span>face-anonymizer</div>
    <nav>
      <div class="grp">화면</div>

      <a onclick="setFilter('active')" id="nav-active" class="st on">진행중<span class="c"></span></a>
      <a onclick="setFilter('running')" id="nav-running" class="st">수행중<span class="c"></span></a>
      <a onclick="setFilter('queued')" id="nav-queued" class="st">대기<span class="c"></span></a>
      <a onclick="setFilter('review')" id="nav-review" class="st">검수<span class="c"></span></a>
      <a onclick="setFilter('done')" id="nav-done" class="st">완료<span class="c"></span></a>
      <a onclick="setFilter('failed')" id="nav-failed" class="st">실패<span class="c"></span></a>
      <a onclick="setFilter('')" id="nav-all" class="st">전체 기록<span class="c"></span></a>
    </nav>
    <div class="hud">
      <div class="hd">
        <span class="dot" id="hdot"></span>

  <main>
    <div class="top">
      <h1 id="page">파일 브라우저</h1>
      <span class="badge" id="dev">—</span>
    </div>

    <div class="content">
      <div class="kpis" id="kpis"></div>

      <!-- 현황 -->
      <section class="view" id="view-overview" hidden>
        <div class="grid2">
          <section class="card">
            <h2>폴더별 진척률
              <span class="cnt" id="progsum"></span></h2>
            <div id="prog" class="pad"><div class="empty">불러오는 중…</div></div>
          </section>
          <section class="card">
            <h2>큐 · 자원</h2>
            <div id="opsbody" class="pad"></div>
          </section>
        </div>

            </select>

                                       autocomplete="off"></div>
            <label class="toggle"><input type="checkbox" id="lggroup">
              <span>작업 단위로 묶기</span></label>

      <!-- 파일 브라우저 · 작업 -->
      <div class="grid2" id="view-work">
        <section class="card" id="card-browser">
          <div class="bar">
            <div class="crumb" id="crumb"></div>
            <div class="search"><input id="q" placeholder="이름으로 검색" autocomplete="off"></div>
            <button class="ghost" onclick="loadObjects()">새로고침</button>
            <span class="divider"></span>

                <select id="method">
                  <option value="mosaic">모자이크</option>
                  <option value="blur">블러</option>

                </select></div>

              <div><label>추론 해상도</label>

                  <option value="960">960</option>

                  <option value="1600">1600</option>

                <input type="number" id="batch" value="16" min="1" max="64"></div>

        <!-- 큐 화면. 무엇이 들어와 있고, 무엇이 돌고, 무엇이 나갔나. -->

          <div id="queueui"></div>

          <h2><span id="jobstitle">작업</span>
            <span class="chip" id="jobfilter" hidden></span>

<script>
const $ = s => document.querySelector(s);
const go = $('#go');
// 기본 목록은 '진행중'(수행중 + 대기) 이다. 끝난 것을 같이 섞으면 수백 건짜리
// 배치에서 지금 할 일이 완료 기록에 파묻힌다 — 완료는 완료 탭에서 본다.
let timer = null, filter = 'active', page = 0, pageSize = 5, lastJobsHtml = '';

function fmt(s) {
  // 값이 없으면 'NaN:NaN' 이 아니라 '—' 이어야 한다. 옛 기록에는 빠진 항목이 있다.
  if (!Number.isFinite(s)) return '—';
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`
           : `${m}:${String(x).padStart(2,'0')}`;
}
function humanSize(b) {
  if (b == null) return '—';
  const u = ['B','KB','MB','GB','TB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return `${b.toFixed(i ? 1 : 0)} ${u[i]}`;
}
function humanTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso); if (isNaN(d)) return '—';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} `
       + `${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ── S3 브라우저 ────────────────────────────────────────────────────────────
//
// 서버 계약:
//   GET /api/s3/objects?prefix=videos/2026-08/
//     -> { bucket, prefix, folders:["videos/2026-08/raw/"],
//          objects:[{key, size, modified, processed?}] }
//   POST /api/jobs (form) s3_key=<key> + 기존 옵션
//
// 연결 전이면 404 가 온다. 안내만 띄우고 직접 업로드로 쓸 수 있게 둔다.
const S3 = { bucket:'', prefix:'', folders:[], objects:[], selected:new Set(), error:null };
const VIDEO_RE = /\.(mp4|mov|mkv|avi|webm|m4v)$/i;

async function loadObjects(prefix) {
  if (prefix !== undefined) { S3.prefix = prefix; S3.selected.clear(); }
  try {
    const r = await fetch('/api/s3/objects?prefix=' + encodeURIComponent(S3.prefix));
    if (!r.ok) throw new Error(r.status === 404 ? 'not-configured' : 'HTTP ' + r.status);
    const d = await r.json();
    S3.bucket = d.bucket || ''; S3.folders = d.folders || [];
    S3.objects = d.objects || []; S3.error = null;
  } catch (e) {
    S3.error = e.message; S3.folders = []; S3.objects = [];
  }
  renderBrowser();
}

function crumbs() {
  const el = $('#crumb');
  if (!S3.bucket) { el.innerHTML = '<span class="cur">S3</span>'; return; }
  const parts = S3.prefix.split('/').filter(Boolean);
  let acc = '';
  const items = [`<a onclick="loadObjects('')">${S3.bucket}</a>`];
  parts.forEach((p, i) => {
    acc += p + '/'; const path = acc;
    items.push(i === parts.length - 1 ? `<span class="cur">${p}</span>`
                                      : `<a onclick="loadObjects('${path}')">${p}</a>`);
  });
  el.innerHTML = items.join('<span class="sep">/</span>');
}

function renderBrowser() {
  crumbs();
  const el = $('#browser');
  if (S3.error === 'not-configured') {
    el.innerHTML = `<div class="empty">S3 가 연결되지 않았습니다<br>
      <span style="font-size:11.5px">직접 업로드로 처리할 수 있습니다</span></div>`;
    return updatePicked();
  }
  if (S3.error) {
    el.innerHTML = `<div class="empty">목록을 불러오지 못했습니다 (${S3.error})</div>`;
    return updatePicked();
  }
  const q = ($('#q').value || '').toLowerCase();
  const folders = S3.folders.filter(f => f.toLowerCase().includes(q));
  const objects = S3.objects.filter(o => o.key.toLowerCase().includes(q));
  if (!folders.length && !objects.length) {
    el.innerHTML = '<div class="empty">항목이 없습니다</div>';
    return updatePicked();
  }
  // 폴더도 파일과 똑같이 체크해서 고른다. 폴더를 고르면 그 안의 영상 전부가
  // 들어간다 — 별도의 '폴더 전체 제출' 버튼을 두면 같은 일에 버튼이 둘이 된다.
  const selectable = folders.concat(objects.filter(o => VIDEO_RE.test(o.key))
                                           .map(o => o.key));
  const allSel = selectable.length && selectable.every(k => S3.selected.has(k));

  const rows = folders.map(f => {
    const name = f.replace(S3.prefix, '').replace(/\/$/, '');
    const sel = S3.selected.has(f);
    return `<tr class="${sel ? 'sel' : ''}">
      <td><input type="checkbox" ${sel ? 'checked' : ''}
            onchange="toggle('${f}', this.checked)"></td>
      <td><div class="key"><span class="ico">▸</span>
        <span class="nm"><a onclick="loadObjects('${f}')">${name}/</a></span></div></td>
      <td class="num">—</td><td class="when">—</td>
      <td><span class="tag plain">폴더</span></td></tr>`;
  }).concat(objects.map(o => {
    const name = o.key.replace(S3.prefix, '');
    const isVideo = VIDEO_RE.test(o.key), sel = S3.selected.has(o.key);
    const tag = o.processed ? '<span class="tag done">처리됨</span>'
              : (isVideo ? '' : '<span class="tag plain">영상 아님</span>');
    return `<tr class="${sel ? 'sel' : ''}">
      <td>${isVideo ? `<input type="checkbox" ${sel ? 'checked' : ''}
            onchange="toggle('${o.key}', this.checked)">` : ''}</td>
      <td><div class="key"><span class="ico">▤</span>
        <span class="nm" title="${o.key}">${name}</span></div></td>
      <td class="num">${humanSize(o.size)}</td>
      <td class="when">${humanTime(o.modified)}</td>
      <td>${tag}</td></tr>`;
  }));

  el.innerHTML = `<table><thead><tr>
      <th style="width:38px">${selectable.length
        ? `<input type="checkbox" ${allSel ? 'checked' : ''}
             onchange="toggleAll(this.checked)">` : ''}</th>
      <th>이름</th><th style="width:88px;text-align:right">크기</th>
      <th style="width:132px">마지막 수정</th><th style="width:86px"></th>
    </tr></thead><tbody>${rows.join('')}</tbody></table>`;
  updatePicked();
}

const isFolder = k => k.endsWith('/');
function toggle(key, on) { on ? S3.selected.add(key) : S3.selected.delete(key); renderBrowser(); }
function toggleAll(on) {
  const q = ($('#q').value || '').toLowerCase();
  S3.folders.filter(f => f.toLowerCase().includes(q))
    .forEach(f => on ? S3.selected.add(f) : S3.selected.delete(f));
  S3.objects.filter(o => VIDEO_RE.test(o.key) && o.key.toLowerCase().includes(q))
    .forEach(o => on ? S3.selected.add(o.key) : S3.selected.delete(o.key));
  renderBrowser();
}
function split() {
  const all = [...S3.selected];
  return { files: all.filter(k => !isFolder(k)), dirs: all.filter(isFolder) };
}
function updatePicked() {
  const { files, dirs } = split();
  const bits = [];
  if (files.length) bits.push(`영상 <b>${files.length}개</b>`);
  if (dirs.length) bits.push(`폴더 <b>${dirs.length}개</b>`);
  $('#picked').innerHTML = bits.length ? bits.join(' · ') + ' 선택됨'
                                       : '선택된 항목 없음';
  go.disabled = !bits.length;
}

// ── 제출 ───────────────────────────────────────────────────────────────────
// 서버가 RFC 9457 problem+json 을 준다. title/detail/hint 를 그대로 보여 주면
// "왜 안 되는지" 와 "무엇을 하면 되는지" 가 같이 전달된다.
function problemText(p) {
  if (!p || !p.title) return '알 수 없는 오류가 발생했습니다';
  return [p.title, p.detail, p.hint].filter(Boolean).join('\n');
}
function explain(status, text) {
  let p = null; try { p = JSON.parse(text); } catch (_) {}
  return p && p.title ? problemText(p) : (text || `HTTP ${status}`);
}
// 제출 진입점은 POST /api/jobs 하나다. 한 건이든 여러 건이든 폴더든 같은 요청,
// 같은 응답 — 화면에서도 분기가 필요 없다.
async function submitJobs(body, label) {
  go.disabled = true;
  const was = go.textContent;
  go.textContent = label;
  const r = await fetch('/api/jobs', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, params: paramObject() }),
  });
  go.textContent = was;

  if (r.status !== 202) { alert(explain(r.status, await r.text())); poll();
                          updatePicked(); return; }
  const d = await r.json();
  S3.selected.clear(); renderBrowser(); poll();
  if (d.rejected && d.rejected.length) {
    alert(`${d.accepted.length}건 접수, ${d.rejected.length}건은 넣지 못했습니다\n\n`
      + d.rejected.map(x => `${x.s3_key}\n  ${problemText(x.error)}`).join('\n\n'));
  }
}

go.onclick = () => {
  const { files, dirs } = split();
  if (!files.length && !dirs.length) return;
  const skip = $('#skipdone').checked;

  // 폴더는 안에 몇 개가 들었는지 화면에 안 보인다. 그것만 한 번 확인받는다.
  if (dirs.length) {
    const lines = [`선택한 항목을 비식별화합니다.`, ''];
    dirs.forEach(d => lines.push(`폴더   ${d}`));
    if (files.length) lines.push(`영상   ${files.length}개`);
    lines.push('', `이미 처리된 건  ${skip ? '건너뜀' : '다시 처리'}`);
    if (!confirm(lines.join('\n'))) return;
  }
  const label = dirs.length ? '제출 중…' : `제출 중… ${files.length}건`;
  return submitJobs({ s3_keys: files, s3_prefix: dirs, skip_processed: skip },
                    label);
};

function paramObject() {
  return { method: $('#method').value, conf: +$('#conf').value,
           imgsz: +$('#imgsz').value, batch_size: +$('#batch').value,
           keep_audio: $('#audio').checked };
}
$('#q').addEventListener('input', renderBrowser);

const FILTER_TEXT = { active:'진행중', running:'수행중', queued:'대기',
                      review:'검수 필요', done:'완료', failed:'실패' };
const NAV_KEYS = ['active', 'running', 'queued', 'review', 'done', 'failed', ''];
const VIEW_TITLE = { overview:'현황', browser:'파일 브라우저', jobs:'작업',
                     logs:'로그' };
const VIEWS = ['overview', 'browser', 'jobs', 'logs'];
let view = 'browser', lastOverview = 0;

// 사이드바가 목록 필터 하나만 바꾸면 사이드바를 둘 이유가 없다. 화면을 실제로
// 바꾼다 — 현황은 버킷 기준 진척률과 큐·자원, 로그는 시간 축, 나머지 둘은 하던 일.
function go2(v) {
  view = v;
  paintNav();
  $('#page').textContent = VIEW_TITLE[v];
  $('#view-overview').hidden = v !== 'overview';
  $('#view-logs').hidden = v !== 'logs';
  $('#view-work').hidden = v === 'overview' || v === 'logs';
  $('#card-browser').hidden = v === 'jobs';
  $('#view-work').classList.toggle('solo', v === 'jobs');
  // 로그는 작업 상태 KPI 와 아무 상관이 없다. 남겨 두면 위쪽 숫자와 아래쪽
  // 목록이 서로 다른 이야기를 해서 화면이 두 개인 것처럼 읽힌다.
  $('#kpis').hidden = v === 'overview' || v === 'logs';
  if (v === 'overview') loadOverview();
  if (v === 'logs') loadLogs();
  poll();
}

// ---------------------------------------------------------------------------
// 로그 — **시간 축.** 작업 목록이 "지금 어떤가" 라면 이쪽은 "무슨 일이 있었나" 다.
//
// 문장은 서버가 만들어 준다(events.decorate). 여기서 만들면 로그 파일과 화면이
// 다른 말을 하게 되고, 나중에 화면이 하나 더 붙으면 같은 계산을 또 짜게 된다.
const LOG_PAGE = 60;
let logRows = [], logCursor = null, logMore = false, logTimer = null, logOpen = '';

function logQuery(before) {
  const p = ['limit=' + LOG_PAGE];
  const e = $('#lgevent').value, m = $('#lgmode').value, q = $('#lgq').value.trim();
  if (e) p.push('event=' + encodeURIComponent(e));
  if (m) p.push('mode=' + m);
  if (q) p.push('q=' + encodeURIComponent(q));
  if (before) p.push('before=' + before);
  return p.join('&');
}

async function loadLogs(append) {
  const r = await fetch('/api/events?' + logQuery(append ? logCursor : null))
    .then(r => r.json()).catch(() => null);
  if (!r) { $('#lgnote').textContent = '불러오지 못했습니다'; return; }
  logRows = append ? logRows.concat(r.events) : r.events;
  logCursor = r.cursor;
  logMore = r.has_more;
  renderLogs();
  scheduleLogs();
}

function scheduleLogs() {
  clearTimeout(logTimer);
  // '더 보기' 로 아래를 펼쳐 놓았거나 한 작업만 열어 둔 상태에서 자동 갱신이
  // 돌면, 방금 펼친 것이 통째로 접히고 전체 목록으로 되돌아간다. 첫 쪽을
  // 그냥 보고 있을 때만 갱신한다.
  if (view === 'logs' && $('#lglive').checked && !logOpen
      && logRows.length <= LOG_PAGE)
    logTimer = setTimeout(() => loadLogs(), 4000);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}

function logLine(r) {
  const job = r.job ? ` onclick="openLog('${esc(r.job)}')"` : '';
  return `<div class="lrow"${job}>
    <span class="lt">${esc(r.time)}</span>
    <span class="lm ${r.mode === 'msa' ? 'msa' : ''}">${esc(r.mode)}</span>
    <span class="lb ${esc(r.tone)}">${esc(r.label)}</span>
    <span class="ln">${esc(r.name || r.job || '')}</span>
    <span class="lx">${esc(r.text)}</span>
    ${r.batch ? `<span class="lg2">${esc(r.batch)}</span>` : ''}
  </div>`;
}

// 작업 단위로 묶기. 같은 파일에 대한 사건이 시간순으로 흩어져 있으면 "이 파일이
// 어떻게 됐나" 를 눈으로 이어 붙여야 한다. 묶어 두면 한 덩이가 한 파일이다.
function groupLogs(rows) {
  const order = [], byJob = new Map();
  for (const r of rows) {
    const k = r.job || '(작업 없음)';
    if (!byJob.has(k)) { byJob.set(k, []); order.push(k); }
    byJob.get(k).push(r);
  }
  return order.map(k => {
    const list = byJob.get(k);
    const fin = list.find(r => r.event === 'job.finished');
    const bad = list.find(r => r.event === 'job.failed');
    const head = fin || bad || list[0];
    const tone = bad ? 'bad' : '';
    const sub = bad ? bad.text : (fin ? fin.text : `${list.length}건`);
    return `<div class="lgroup">
      <div class="lhead"><span>${esc(head.name || k)}</span>
        ${head.batch ? `<span class="sub">${esc(head.batch)}</span>` : ''}
        <span class="sub ${tone}">${esc(sub)}</span>
        <span class="sub" style="margin-left:auto">${esc(head.mode)}</span></div>
      ${list.map(logLine).join('')}</div>`;
  }).join('');
}

function renderLogs() {
  const grouped = $('#lggroup').checked;
  $('#lgnote').textContent = logOpen
    ? '한 작업만 보는 중 — 같은 줄을 다시 누르면 전체로'
    : (logRows.length ? `${logRows.length}줄${logMore ? ' (더 있음)' : ''}` : '');
  if (!logRows.length) {
    $('#logs').innerHTML = `<div class="empty">기록이 없습니다.
      작업을 한 건 돌리면 여기에 쌓입니다.</div>`;
    return;
  }
  const body = grouped ? groupLogs(logRows) : logRows.map(logLine).join('');
  const more = logMore
    ? `<div class="pager"><button class="ghost" onclick="loadLogs(true)">더 보기</button></div>`
    : '';
  $('#logs').innerHTML = body + more;
}

// 한 작업만 따로 본다. 게시판에서 글 하나를 여는 것과 같다 — 그 파일에 무슨
// 일이 있었는지 처음부터 끝까지가 한 화면에 온다.
function openLog(job) {
  if (logOpen === job) {           // 같은 줄을 다시 누르면 전체로 돌아간다
    logOpen = ''; $('#lgq').value = ''; return loadLogs();
  }
  logOpen = job;
  $('#lggroup').checked = true;
  scheduleLogs();                  // 돌고 있던 자동 갱신을 멈춘다 (logOpen 이므로)
  fetch('/api/events?limit=200&job=' + encodeURIComponent(job))
    .then(r => r.json()).then(r => {
      logRows = r.events; logCursor = r.cursor; logMore = false;
      renderLogs();
    }).catch(() => {});
}

// 필터를 바꾸면 처음부터 다시 읽는다. 커서(before)를 들고 있으면 새 조건에
// 옛 커서가 붙어서 중간부터 나온다.
let logDebounce = null;
function logFilterChanged(delay) {
  logOpen = ''; logCursor = null;
  clearTimeout(logDebounce);
  logDebounce = setTimeout(() => loadLogs(), delay || 0);
}
$('#lgevent').onchange = () => logFilterChanged();
$('#lgmode').onchange = () => logFilterChanged();
$('#lgq').oninput = () => logFilterChanged(250);   // 한 글자마다 때리지 않는다
$('#lggroup').onchange = renderLogs;               // 이미 받은 줄을 다시 그리기만
$('#lglive').onchange = scheduleLogs;

async function loadOverview() {
  lastOverview = Date.now();
  const [m, p, b] = await Promise.all([
    fetch('/api/metrics').then(r => r.json()).catch(() => null),
    fetch('/api/s3/progress').then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('/api/batches').then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  renderProgress(p);
  renderOps(m);
  renderBatches(b);
}

// 폴더 단위로 언제 시작해서 언제 끝났나. 사람이 묻는 단위가 파일이 아니라
// 폴더인 경우가 많다 — "kbs 언제 시작해서 언제 끝났어?"
function renderBatches(b) {
  const rows = (b && b.batches) || [];
  const el = $('#batches');
  if (!el) return;
  $('#card-batches').hidden = !rows.length;
  if (!rows.length) return;
  el.innerHTML = rows.map(r => `
    <div class="job ${r.remain ? '' : 'ok'}">
      <div class="jhead"><div class="jname">${r.batch}</div>
        <span class="tag ${r.remain ? 'run' : 'done'}">${
          r.remain ? `진행중 ${r.percent}%` : '완료'}</span></div>
      <div class="bar2"><i style="width:${r.percent}%"></i></div>
      <div class="meta">${r.span}</div>
      <div class="meta">전체 ${r.total}건 · 완료 ${r.done}${
        r.failed ? ` · 실패 ${r.failed}` : ''}${r.remain ? ` · 남음 ${r.remain}` : ''}</div>
    </div>`).join('');
}

function renderProgress(p) {
  const el = $('#prog');
  if (!p || !p.folders || !p.folders.length) {
    $('#progsum').textContent = '';
    el.innerHTML = '<div class="empty">집계할 입력이 없습니다</div>';
    return;
  }
  $('#progsum').textContent = `${p.done} / ${p.total}건`;
  el.innerHTML = p.folders.map(f => {
    const pc = f.percent;
    return `<div class="prow">
      <div class="t"><b>${f.name}</b>
        <span>${f.done} / ${f.total} · 남음 ${f.remain}</span></div>
      <div class="track ${pc >= 100 ? 'full' : ''}"><i style="width:${pc}%"></i></div>
    </div>`;
  }).join('');
}

function renderOps(m) {
  const el = $('#opsbody');
  if (!m) { el.innerHTML = '<div class="empty">불러오지 못했습니다</div>'; return; }
  const g = m.gpu;
  const cells = [
    ['대기', `${m.depth}<small>건</small>`, ''],
    // 깊이만 보면 '빨리 빠지는 100건'과 '멈춰 있는 3건'을 구분할 수 없다.
    ['가장 오래 기다린 건', m.depth ? fmt(m.latency) : '—',
      m.latency > 1800 ? 'warnv' : ''],
    ['최근 1시간 처리', `${m.throughput_1h}<small>건</small>`, ''],
    ['최근 1시간 실패', `${m.failed_1h}<small>건</small>`,
      m.failed_1h ? 'warnv' : ''],
    ['평균 처리 시간', m.avg_seconds ? fmt(m.avg_seconds) : '—', ''],
    ['재시도한 작업', `${m.retried}<small>건</small>`, m.retried ? 'warnv' : ''],
  ];
  if (g) cells.push(
    ['GPU 사용률', `${g.util}<small>%</small>`, ''],
    ['GPU 메모리', `${(g.mem_used/1024).toFixed(1)}<small>/${(g.mem_total/1024).toFixed(0)} GB</small>`, ''],
    ['GPU 온도', `${g.temp}<small>°C</small>`, g.temp >= 85 ? 'warnv' : '']);
  cells.push(['디스크 여유',
    m.free_mb != null ? `${(m.free_mb/1024).toFixed(1)}<small>GB</small>` : '—',
    (m.free_mb != null && m.free_mb < m.min_free_mb) ? 'warnv' : '']);

  const head = g ? `<div class="wide"><span>워커</span><b style="font-size:12.5px">${g.name}</b></div>`
                 : `<div class="wide"><span>워커</span><b style="font-size:12.5px">GPU 없음 (CPU 추론)</b></div>`;
  el.innerHTML = `<div class="ops">${head}${cells.map(([k, v, c]) =>
    `<div class="${c}"><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;
}


// 숫자는 목록이 아니라 /api/status 의 집계에서 읽는다. 목록은 100건에서
// 잘리므로 거기서 세면 300건짜리 배치에서 전부 틀린다(docs/issues/006).
function counts(st) { return (st && st.counts) || {}; }

function navCount(st, key) {
  const c = counts(st);
  return key === '' ? (c.total || 0) : (c[key] || 0);
}

function navCounts(st) {
  for (const k of NAV_KEYS)
    document.querySelector('#nav-' + (k || 'all') + ' .c').textContent
      = navCount(st, k) || '';
  $('#c-jobs').textContent = navCount(st, '') || '';
}

// 작업 목록이 실제로 그려지는 화면들. 현황과 로그에는 목록이 없다.
const LIST_VIEWS = ['browser', 'jobs'];

// **사이드바를 칠하는 일은 여기 한 곳에서만 한다.**
//
// 화면(위)과 작업 상태(아래)를 각자 칠하게 두면 둘 다 켜진 상태가 만들어진다 —
// '현황' 과 '수행중' 이 동시에 파랗게 켜져 있는데 화면은 현황이라, 무엇을 보고
// 있는지 사이드바가 거짓말을 한다. 상태 선택은 목록이 있는 화면에서만 뜻이
// 있으므로, 목록이 없는 화면에서는 아예 끄고 묶음을 흐리게 한다.
function paintNav() {
  const live = LIST_VIEWS.includes(view);
  for (const k of VIEWS)
    document.getElementById('tab-' + k).classList.toggle('on', k === view);
  for (const k of NAV_KEYS)
    document.getElementById('nav-' + (k || 'all'))
      .classList.toggle('on', live && k === filter);
  document.querySelector('nav').classList.toggle('nolist', !live);
}

function setFilter(f) {
  filter = f;
  page = 0;                      // 탭을 바꾸면 첫 페이지부터
  // 목록이 없는 화면에서 상태를 누르면 그 선택이 아무 데도 안 보인다.
  // 누른 사람의 뜻은 "그 목록을 보겠다" 이므로 목록이 있는 화면으로 데려간다.
  if (!LIST_VIEWS.includes(view)) return go2('jobs');
  paintNav();
  poll();
}

function goPage(p) { page = Math.max(0, p); poll(); }

// ── KPI · 상태 박스 · 작업 목록 ────────────────────────────────────────────
const RAD = 24, CIRC = 2 * Math.PI * RAD;
function ring(pct) {
  return `<div class="ringwrap">
    <svg width="58" height="58" viewBox="0 0 58 58">
      <circle class="trk" cx="29" cy="29" r="${RAD}"></circle>
      <circle class="fil" cx="29" cy="29" r="${RAD}"
              stroke-dasharray="${CIRC*pct/100} ${CIRC}"></circle>
    </svg><span class="pct">${Math.round(pct)}%</span></div>`;
}

// 완료 평균도 서버가 센다. 목록 안의 완료 카드를 뒤지면 목록이 잘렸을 때
// 같이 사라져 '기록 없음' 이 된다.
function avgSeconds(st) {
  const r = (st && st.recent) || {};
  return r.avg_seconds || null;
}

// 작업 한 건에 걸리는 시간. 완료 기록이 있으면 그 평균이 제일 정확하고,
// 없으면 지금 도는 작업의 진행률로 되짚는다. 첫 배치에서는 완료가 하나도
// 없으니 평균만 보면 끝날 때까지 '계산 중' 이다 — 그게 이 화면의 버그였다.
//
// overall 은 이제 전 단계를 한 자로 잰다(progress.py). 예전처럼 검출·렌더만
// 세면 전사에 쓴 시간이 분자에만 들어가서 남은 시간이 몇 배로 부풀었다.
function jobSeconds(st, running) {
  const avg = avgSeconds(st);
  if (avg) return avg;
  if (running && running.overall >= 5 && running.job_elapsed > 0)
    return running.job_elapsed * 100 / running.overall;
  return null;
}

function tile(lb, v, sub, cls) {
  return `<div class="tile ${cls || ''}"><div class="lb">${lb}</div>
    <div class="v">${v}</div><div class="sub">${sub || ''}</div></div>`;
}

// 탭마다 다른 숫자를 띄운다. 사이드바를 눌러도 같은 타일 넉 장이 그대로면
// 사이드바가 목록 필터 하나짜리로 되돌아간다 — 화면이 실제로 달라야 한다.
function kpis(jobs, st) {
  const c = counts(st), q = (st && st.queue) || {}, r = (st && st.recent) || {};
  // 수행중은 목록이 아니라 상태에서 받는다 — '완료' 탭을 눌러도 사라지면 안 된다.
  const running = (st && st.running) || jobs.find(j => j.status === 'running');
  const queued = c.queued || 0, done = c.done || 0, failed = c.failed || 0;
  const avg = avgSeconds(st), per = jobSeconds(st, running);
  const disk = st && st.free_mb != null
    ? `디스크 여유 ${(st.free_mb/1024).toFixed(1)} GB` : '';
  let t;

  if (filter === 'running') {
    t = running ? [
      tile('진행률', `${Math.round(running.overall)}<small>%</small>`,
           `${STAGE_TEXT[running.stage] || '준비'} ${running.percent}%`, 'hero'),
      tile('이 작업 남은 시간', fmt(running.job_eta),
           `경과 ${fmt(running.job_elapsed)}`),
      tile('속도', `${running.fps.toFixed(0)}<small> f/s</small>`,
           running.name),
      tile('뒤에 대기', `${queued}<small>건</small>`, disk),
    ] : [tile('수행중', '없음', queued ? '곧 시작합니다' : '처리할 작업이 없습니다', 'hero'),
         tile('대기', `${queued}<small>건</small>`, ''),
         tile('완료', `${done}<small>건</small>`, avg ? `평균 ${fmt(avg)}` : ''),
         tile('자원', '—', disk)];

  } else if (filter === 'queued') {
    t = [
      tile('대기', `${queued}<small>건</small>`,
           queued ? `가장 오래 기다린 건 ${fmt(q.latency || 0)}` : '큐가 비었습니다', 'hero'),
      tile('예상 소요', per != null && queued ? fmt(queued * per) : '계산 중',
           per != null ? `한 건 ${fmt(per)} 기준` : '완료 기록이 쌓이면 계산됩니다'),
      tile('다음 차례', (st && st.next_up && st.next_up[0]) || '—',
           running ? `지금은 ${running.name}` : '유휴'),
      tile('최근 1시간 처리', `${q.throughput_1h || 0}<small>건</small>`,
           q.failed_1h ? `같은 시간 실패 ${q.failed_1h}건` : disk),
    ];

  } else if (filter === 'done') {
    t = [
      tile('완료', `${done}<small>건</small>`,
           avg ? `평균 ${fmt(avg)}` : '기록 없음', 'hero'),
      tile('평균 처리 시간', q.avg_seconds ? fmt(q.avg_seconds) : '—',
           q.slowest_seconds ? `가장 오래 걸린 건 ${fmt(q.slowest_seconds)}` : ''),
      tile('처리 속도', r.realtime_factor ? r.realtime_factor.toFixed(2) : '—',
           '<small>× 실시간</small>'),
      tile('최근 1시간', `${q.throughput_1h || 0}<small>건</small>`, disk),
    ];

  } else if (filter === 'review') {
    // 이 탭이 답해야 하는 질문은 "몇 건이 나를 기다리나" 와 "왜 걸렸나" 다.
    // 처리 속도 같은 건 여기서 아무 의미가 없다.
    const rv = c.review || 0;
    const codes = {};
    for (const j of jobs) for (const i of (j.review || []))
      codes[i.code] = (codes[i.code] || 0) + 1;
    const top = Object.entries(codes).sort((a, b) => b[1] - a[1])[0];
    t = [
      tile('검수 대기', `${rv}<small>건</small>`,
           rv ? '확인 후 완료 또는 반려로 넘겨 주세요' : '확인할 작업이 없습니다', 'hero'),
      tile('가장 흔한 사유', top ? `${top[1]}<small>건</small>` : '—',
           top ? (REVIEW_TEXT[top[0]] || top[0]) : ''),
      tile('완료', `${done}<small>건</small>`,
           avg ? `평균 ${fmt(avg)}` : ''),
      tile('실패', `${failed}<small>건</small>`, disk),
    ];

  } else if (filter === 'failed') {
    t = [
      tile('실패', `${failed}<small>건</small>`,
           failed ? '카드에 단계와 사유가 있습니다' : '실패한 작업이 없습니다', 'hero'),
      tile('최근 1시간 실패', `${q.failed_1h || 0}<small>건</small>`,
           done + failed ? `실패율 ${(100*failed/(done+failed)).toFixed(1)}%` : ''),
      tile('재시도한 작업', `${q.retried || 0}<small>건</small>`,
           `최대 ${(st && st.max_attempts) || ''}회까지 시도합니다`),
      tile('취소됨', `${c.cancelled || 0}<small>건</small>`, disk),
    ];

  } else if (filter === '') {
    t = [
      tile('전체 기록', `${c.total || 0}<small>건</small>`,
           '이 서버가 기억하고 있는 전부입니다', 'hero'),
      tile('완료', `${done}<small>건</small>`, avg ? `평균 ${fmt(avg)}` : ''),
      tile('실패 · 취소', `${failed}<small> · </small>${c.cancelled || 0}`, ''),
      tile('진행중', `${c.active || 0}<small>건</small>`, disk),
    ];

  } else {                                        // active — 기본 화면
    const remain = (running ? 1 : 0) + queued;
    // 수행중 작업은 '이 작업이 끝나기까지'(job_eta), 대기는 한 건 소요 x 건수.
    const etaAll = running && per != null
      ? (running.job_eta || 0) + queued * per : null;
    t = [
      tile('전체 남은 시간',
           etaAll != null ? fmt(etaAll) : (remain ? '계산 중' : '없음'),
           remain ? `남은 작업 ${remain}건` : '처리할 작업이 없습니다', 'hero'),
      tile('수행중 · 대기', `${running ? 1 : 0}<small>/</small>${queued}`,
           running ? running.name : '유휴'),
      tile('완료', `${done}${failed
             ? `<small style="color:var(--critical)"> · 실패 ${failed}</small>` : ''}`,
           avg ? `평균 ${fmt(avg)}` : (per ? `추정 ${fmt(per)}` : '기록 없음')),
      tile('처리 속도',
           `${r.realtime_factor ? r.realtime_factor.toFixed(2) : '—'}<small>× 실시간</small>`,
           disk),
    ];
  }
  $('#kpis').innerHTML = t.join('');
}

// 큐 화면. **무엇이 들어와 있고, 무엇이 돌고, 무엇이 나갔나** 를 한 줄로 본다.
// 카드 목록은 개별 작업을 보는 도구라 큐 전체의 모양은 보여 주지 못한다.
function renderQueue(st) {
  const c = counts(st), q = (st && st.queue) || {}, run = st && st.running;
  const out = (c.done || 0) + (c.failed || 0);
  $('#queuesub').textContent = `들어와 있는 것 ${c.queued || 0}건 · 나간 것 ${out}건`;
  $('#queueui').innerHTML = `
    <div class="flow">
      <div class="box">
        <div class="lb">들어와 있는 것</div>
        <div class="v">${c.queued || 0}<small>건</small></div>
        <div class="sub">${c.queued
          ? `가장 오래 기다린 건 ${fmt(q.latency || 0)}` : '큐가 비었습니다'}</div>
      </div>
      <div class="arw">▶</div>
      <div class="box mid">
        <div class="lb">처리중</div>
        <div class="v" title="${run ? run.name : ''}">${run ? run.name : '유휴'}</div>
        <div class="sub">${run
          ? `${STAGE_TEXT[run.stage] || '준비'} ${Math.round(run.overall)}% · 남은 ${fmt(run.eta)}`
          : '큐에서 꺼낼 작업이 없습니다'}</div>
      </div>
      <div class="arw">▶</div>
      <div class="box">
        <div class="lb">나간 것</div>
        <div class="v">${c.done || 0}<small>건</small>${c.failed
          ? `<small style="color:var(--critical)"> · 실패 ${c.failed}</small>` : ''}</div>
        <div class="sub">최근 1시간 ${q.throughput_1h || 0}건 · 평균 ${
          q.avg_seconds ? fmt(q.avg_seconds) : '—'}</div>
      </div>
    </div>
    ${(st && st.next_up && st.next_up.length)
      ? `<div class="nextup"><span class="hd">다음 차례</span>${
          st.next_up.map(n => `<span>${n}</span>`).join('')}</div>` : ''}`;
}

function hud(jobs, st) {
  const dot = $('#hdot'), title = $('#htitle'), body = $('#hbody');
  if (!st) {
    dot.className = 'dot err'; title.textContent = '서버 연결 끊김';
    body.innerHTML = '<div class="idle">응답이 없습니다</div>'; return;
  }
  if (!st.ready) {
    dot.className = 'dot err'; title.textContent = '준비 중';
    body.innerHTML = `<div class="idle">${st.model_error || '모델을 올리는 중'}</div>`; return;
  }
  const c = counts(st);
  const running = st.running || jobs.find(j => j.status === 'running');
  const queued = c.queued || 0;
  const remain = (running ? 1 : 0) + queued;
  const avg = avgSeconds(st);

  dot.className = 'dot ' + (running ? 'run' : 'ok');
  title.textContent = running ? `수행중 · 남은 ${remain}건`
                              : (remain ? `대기 ${remain}건` : '유휴');
  if (!running) {
    body.innerHTML = `<div class="idle">${remain ? '곧 시작합니다' : '처리할 작업이 없습니다'}</div>
      <div class="hgrid">
        <div><span>대기</span><b>${queued}건</b></div>
        <div><span>디스크</span><b>${st.free_mb != null
          ? (st.free_mb/1024).toFixed(1) + ' GB' : '—'}</b></div>
      </div>`;
    return;
  }
  const stage = STAGE_TEXT[running.stage] || '준비';
  body.innerHTML = `
    <div class="ring">${ring(running.overall)}
      <div class="who">
        <div class="nm" title="${running.name}">${running.name}</div>
        <div class="st">
          <span class="chip ${running.stage==='detect'?'on':''}">검출</span>
          <span class="chip ${running.stage==='render'?'on':''}">렌더</span>
        </div>
        <div class="st" style="margin-top:3px">${stage} ${running.percent}% ·
          ${running.fps.toFixed(0)} f/s</div>
      </div></div>
    <div class="hgrid">
      <div><span>이 작업</span><b>${fmt(running.eta)}</b></div>
      <div><span>전체</span><b>${avg ? fmt(running.eta + queued*avg) : '—'}</b></div>
    </div>`;
}

const WARN_TEXT = { 'no-detections':
  '얼굴이 하나도 검출되지 않았습니다 — 원본이 그대로 출력됐습니다. 임계값을 낮추거나 영상 회전을 확인하세요.' };

// 검수 사유 코드의 짧은 이름. 카드에는 서버가 준 긴 문장을 쓰고, 여기는
// 타일 한 칸에 들어갈 말이다.
const REVIEW_TEXT = { 'no-detections':'얼굴 검출 0건',
                      'low-detection-rate':'검출률이 매우 낮음',
                      'decode-partial':'영상을 끝까지 읽지 못함',
                      'decode-short':'프레임 수가 원본보다 적음' };
const STAGE_TEXT = { download:'S3 내려받기', transcode:'변환 → H.264',
                     detect:'검출', render:'렌더', upload:'S3 올리기' };

function card(j) {
  const cls = j.status === 'done' ? 'ok' : '';
  const label = { queued:'대기', running:'수행중', review:'검수 필요', done:'완료',
                  failed:'실패', cancelled:'취소됨' }[j.status] || j.status;
  const tagcls = j.status === 'done' ? 'done'
               : (j.status === 'failed' || j.status === 'cancelled') ? 'err'
               : j.status === 'review' ? 'warnt'
               : j.status === 'running' ? 'run' : '';
  let body = '';
  if (j.status === 'running') {
    const stage = STAGE_TEXT[j.stage] || '준비';
    body = `<div class="bar2"><i style="width:${j.overall}%"></i></div>
      <div class="meta">${stage} ${j.percent}% · ${j.fps.toFixed(0)} f/s ·
        남은 시간 ${fmt(j.eta)}</div>
      <div class="meta">${j.span || ''}</div>
      <div class="row"><button class="ghost" onclick="cancel('${j.id}')">취소</button></div>`;
  } else if (j.status === 'queued') {
    const retry = j.attempts ? ` · 재시도 ${j.attempts}/${j.max_attempts}` : '';
    // 그냥 '대기' 로 두면 왜 안 도는지 알 수 없다. 기다리는 이유를 적는다.
    const why = { retry: '재시도 대기', defer: '보류' }[j.waiting];
    const head = why ? `${why} · ${fmt(j.wait_left)} 뒤`
                     : `앞에 ${j.queued_ahead}건`;
    const reason = (j.waiting === 'defer' && j.error && j.error.title)
                 ? `<br><span style="opacity:.8">${j.error.title}</span>` : '';
    body = `<div class="bar2"><i style="width:0"></i></div>
      <div class="meta">${head}${retry}${reason}</div>
      <div class="row"><button class="ghost" onclick="cancel('${j.id}')">취소</button></div>`;
  } else if (j.status === 'review') {
    // 처리는 끝났다. 여기서 사람이 보고 넘기기 전까지는 완료가 아니다.
    // 판정 근거(왜 걸렸나)와 판정 수단(볼 수 있는 링크)을 한 자리에 둔다 —
    // 둘 중 하나라도 없으면 사람은 판정을 미루게 된다.
    const r = j.result || {};
    const why = (j.review || []).map(i =>
      `<b>${i.message}</b><br><span style="opacity:.7">${i.detail}</span>`).join('<br><br>');
    body = `<div class="warn">${why || '확인이 필요합니다'}</div>
      <div class="stats">
        <div><span>프레임</span><b>${r.frames ?? '—'}</b></div>
        <div><span>검출</span><b>${r.raw_boxes ?? '—'}</b></div>
        <div><span>검출률</span><b>${r.detection_rate != null
            ? (r.detection_rate * 100).toFixed(1) + '%' : '—'}</b></div>
        <div><span>처리 시간</span><b>${fmt(r.seconds)}</b></div>
      </div>
      <div class="meta" style="margin-top:8px">${j.span || '—'}</div>
      <div class="row">
        <a class="dl" href="/api/jobs/${j.id}/download">결과 확인</a>
        <button onclick="review('${j.id}','approve')">완료로 넘기기</button>
        <button class="ghost" onclick="review('${j.id}','reject')">반려</button>
      </div>`;
  } else if (j.status === 'failed' || j.status === 'cancelled') {
    const e = j.error || {};
    // '3회 시도' 라는 숫자만 있으면 그게 많은 건지 적은 건지 알 수 없다.
    // 어디서 넘어졌고 왜 그렇게 끝났는지를 같이 적는다.
    const why = {
      permanent: `같은 파일로 다시 시도해도 결과가 같은 오류라 재시도하지 않았습니다`,
      exhausted: `일시적인 오류로 보고 ${j.max_attempts}회까지 다시 시도했지만 계속 실패했습니다`,
    }[e.policy] || '';
    const rows = [
      ['단계', STAGE_TEXT[e.stage] || (e.stage || '—')],
      ['시도', j.attempts ? `${j.attempts}회` : '—'],
      j.s3_key ? ['입력', j.s3_key] : null,
    ].filter(Boolean);
    body = `<div class="warn">
        <b>${e.title || '실패'}
           ${e.code ? `<span class="tag err" style="float:right">${e.code}</span>` : ''}</b>
        ${e.detail || ''}${e.hint ? `<br><span style="opacity:.8">${e.hint}</span>` : ''}
        ${why ? `<br><span style="opacity:.8">${why}</span>` : ''}
      </div>
      <div class="kv">${rows.map(([k, v]) =>
        `<div><span>${k}</span><b title="${v}">${v}</b></div>`).join('')}</div>`;
  } else {
    // 옛 버전이 쓴 job.json 에는 없는 항목이 있을 수 있다. 카드 하나가
    // 던지면 목록 전체가 안 그려지므로 기본값을 깔고 간다.
    const r = j.result || {}, t = r.timing || {}, v = r.video || {};
    const warns = (r.warnings || []).length
      ? `<div class="warn"><b>확인 필요</b>${
          r.warnings.map(w => WARN_TEXT[w] || w).join('<br>')}</div>` : '';
    body = `<div class="bar2"><i style="width:100%"></i></div>${warns}
      <div class="stats">
        <div><span>처리 시간</span><b>${fmt(r.seconds)}</b></div>
        <div><span>속도</span><b>${r.fps ?? '—'} f/s</b></div>
        <div><span>실시간 대비</span><b>${r.realtime_factor ?? '—'}×</b></div>
        <div><span>프레임</span><b>${r.frames ?? '—'}</b></div>
        <div><span>검출</span><b>${r.raw_boxes ?? '—'}</b></div>
        <div><span>보간</span><b>${r.filled_boxes ?? '—'}</b></div>
      </div>
      <div class="meta" style="margin-top:8px">${j.span || '—'}</div>
      <div class="meta" style="margin-top:4px">검출 ${fmt(t.detect)} · 추적 ${fmt(t.track)}
        · 렌더 ${fmt(t.render)} · ${v.width}×${v.height} · ${r.method || '—'}</div>
      <div class="row">
        <a class="dl" href="/api/jobs/${j.id}/download">내려받기</a>
      </div>`;
  }
  // 끝난 작업만 지울 수 있다. 대기·수행중은 '취소' 가 따로 있고, 둘을 같은
  // 자리에 두면 무엇이 멈추고 무엇이 사라지는지 구분이 안 된다.
  // 검수 대기는 못 지운다. 판정 전에 지우면 왜 걸렸는지가 같이 사라진다.
  const over = ['done', 'failed', 'cancelled'].includes(j.status);
  const x = over ? `<button class="jx" onclick="del('${j.id}')"
      title="목록에서 지웁니다. S3 의 원본과 결과물은 그대로 남습니다">&times;</button>` : '';
  return `<div class="job ${cls}" id="job-${j.id}">
    <div class="jhead">${x}<div class="jname" title="${j.name}">${j.name}</div>
      <span class="tag ${tagcls}">${label}</span></div>${body}</div>`;
}

// 카드 한 장이 던져도 목록 전체가 사라지면 안 된다. 더 나쁜 것은 그 예외가
// poll() 을 뚫고 나가 **폴링이 멈추는** 것이다 — 화면이 그 시점에 얼어붙는다.
function safeCard(j) {
  try {
    return card(j);
  } catch (e) {
    console.error('카드를 그리지 못했습니다', j && j.id, e);
    return `<div class="job" id="job-${j.id}">
      <div class="jhead"><div class="jname">${j.name || j.id}</div>
        <span class="tag err">표시 오류</span></div>
      <div class="meta">이 작업의 기록을 화면에 옮기지 못했습니다 —
        <a href="/api/jobs/${j.id}">원본 보기</a></div></div>`;
  }
}

// 페이지 막대. 총 건수는 목록이 아니라 집계에서 온다 — 목록은 한 쪽만 안다.
// 한 쪽이 작아 쪽이 수십 개가 되므로 처음·마지막과 쪽 번호 입력을 같이 둔다.
function pager(total) {
  const pages = Math.max(1, Math.ceil(total / pageSize));
  if (pages <= 1) return '';
  const from = page * pageSize + 1, to = Math.min(total, (page + 1) * pageSize);
  const first = page === 0 ? 'disabled' : '', last = page >= pages - 1 ? 'disabled' : '';
  return `<div class="pager">
    <button class="ghost" ${first} onclick="goPage(0)">처음</button>
    <button class="ghost" ${first} onclick="goPage(${page - 1})">이전</button>
    <span>${from}–${to} / ${total}건 ·
      <input type="number" min="1" max="${pages}" value="${page + 1}"
             onchange="goPage(this.value - 1)"> / ${pages} 쪽</span>
    <button class="ghost" ${last} onclick="goPage(${page + 1})">다음</button>
    <button class="ghost" ${last} onclick="goPage(${pages - 1})">마지막</button>
  </div>`;
}

// 전체 취소. **카드의 '취소' 와 같은 자리에 두지 않는다** — 한 건을 멈추는 것과
// 전부를 멈추는 것은 되돌릴 수 없는 정도가 다르다. 목록 밖 오른쪽 끝에 두고,
// 누르면 바로 실행하지 않고 한 번 더 묻는다.
let confirming = false;

function askCancelAll(on) { confirming = on; poll(); }

async function cancelAll() {
  confirming = false;
  const r = await fetch('/api/jobs/cancel-all', { method: 'POST' });
  if (!r.ok) alert(explain(r.status, await r.text()));
  poll();
}

function renderCancelAll(st) {
  const n = counts(st).active || 0;
  const el = $('#jobsact');
  // 끝난 것을 보는 화면(완료·실패·전체 기록)에는 두지 않는다. 그 화면의 카드는
  // 취소할 수 있는 것이 아니라서, 버튼이 무엇을 멈추는지 읽히지 않는다.
  const here = ['active', 'running', 'queued'].includes(filter);
  if (!n || !here) { confirming = false; el.innerHTML = ''; return; }
  el.innerHTML = confirming
    ? `<span class="confirm">진행중 ${n}건을 전부 멈춥니다. S3 파일은 그대로입니다.
         <button class="ghost danger" onclick="cancelAll()">전부 멈춤</button>
         <button class="ghost" onclick="askCancelAll(false)">아니오</button></span>`
    : `<button class="ghost danger" onclick="askCancelAll(true)"
               title="대기 전부와 지금 돌고 있는 1건을 멈춥니다">전체 취소</button>`;
}

// 검수 판정. **되돌릴 수 없으니 한 번 묻는다** — 완료로 넘기면 그대로 납품된다.
async function review(id, action) {
  const ask = action === 'approve'
    ? '완료로 넘길까요? 이 영상은 납품 대상이 됩니다.'
    : '반려할까요? 실패로 기록되며, 버킷의 결과물은 지우지 않습니다.';
  if (!confirm(ask)) return;
  const note = action === 'reject'
    ? (prompt('반려 사유 (선택)') || '') : '';
  const r = await fetch('/api/jobs/' + id + '/review', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, note }),
  });
  if (!r.ok) {
    const p = await r.json().catch(() => ({}));
    alert(problemText(p) || '판정을 반영하지 못했습니다');
  }
  poll();
}

async function del(id) { await fetch('/api/jobs/' + id, { method:'DELETE' }); poll(); }
async function cancel(id) {
  const r = await fetch(`/api/jobs/${id}/cancel`, { method:'POST' });
  if (!r.ok) alert(explain(r.status, await r.text()));
  poll();
}

async function poll() {
  // 거르는 일은 서버가 한다. 잘라 받은 다음 여기서 거르면, 완료가 100건 창
  // 밖에 있을 때 '완료' 탭이 비어 보인다(docs/issues/006).
  //
  // 어느 필터로 요청했는지 붙잡아 둔다. 탭을 누르면 이전 폴링이 아직 날아오는
  // 중이라, 그게 나중에 도착해 방금 고른 탭 위에 옛 목록을 덮어쓴다.
  const asked = filter, askedPage = page;
  const q = ['limit=' + pageSize, asked ? 'status=' + asked : '',
             askedPage ? 'offset=' + askedPage * pageSize : ''].filter(Boolean).join('&');
  const [jobs, st] = await Promise.all([
    fetch('/api/jobs?' + q).then(r => r.json()).catch(() => null),
    fetch('/api/status').then(r => r.json()).catch(() => null),
  ]);
  // 그 사이 탭이나 쪽이 바뀌었다 — 새 폴링이 그린다
  if (asked !== filter || askedPage !== page) return;
  hud(jobs || [], st);
  if (!jobs) return;
  kpis(jobs, st);
  navCounts(st);
  renderCancelAll(st);
  const c = counts(st);
  if (st && st.page_size) pageSize = st.page_size;
  // 큐 화면은 대기 탭에서만. 탭마다 화면이 실제로 달라야 사이드바가 의미를 갖는다.
  $('#card-queue').hidden = !(filter === 'queued' && view !== 'overview');
  if (!$('#card-queue').hidden) renderQueue(st);
  $('#jobstitle').textContent = FILTER_TEXT[filter] || '전체 기록';
  const total = navCount(st, filter);
  // 큐가 빠지면서 총 건수가 줄면 지금 쪽이 빈 쪽이 된다. 뒤로 물러난다.
  const lastPage = Math.max(0, Math.ceil(total / pageSize) - 1);
  if (page > lastPage) return goPage(lastPage);
  $('#jobcnt').textContent = `${total}건`;
  // 제목이 이미 필터 이름이라 '대기만 ×' 칩은 같은 말을 두 번 하는 셈이다.
  // 되돌아가는 길은 사이드바에 있다.
  $('#jobfilter').hidden = true;
  const html = jobs.length
    ? jobs.map(safeCard).join('') + pager(total)
    : `<div class="empty">${filter === 'active' ? '처리할 작업이 없습니다'
        : filter ? `${FILTER_TEXT[filter]} 상태인 작업이 없습니다` : '작업이 없습니다'}</div>`;
  // 바뀐 게 없으면 다시 그리지 않는다. 0.7초마다 통째로 갈아 끼우면 쪽 번호를
  // 입력하는 중에 포커스가 날아가고, 카드를 읽는 동안 화면이 미세하게 떨린다.
  if (html !== lastJobsHtml) { $('#jobs').innerHTML = html; lastJobsHtml = html; }
  if (view === 'overview' && Date.now() - lastOverview > 10000) loadOverview();
  // 목록을 걸러 보고 있어도 큐가 돌면 빠르게 폴링해야 한다.
  const busy = (c.running || 0) + (c.queued || 0) > 0
    || jobs.some(j => j.status === 'running' || j.status === 'queued');
  clearTimeout(timer);
  timer = setTimeout(poll, busy ? 700 : 5000);
}

fetch('/api/health').then(r => r.json()).then(h => {
  $('#dev').textContent = h.model_loaded
    ? `${h.device} · half=${h.half} · imgsz ${h.imgsz}` : '모델 준비 중';
}).catch(() => $('#dev').textContent = '연결 실패');

// 컨트롤 초깃값은 서버에서 받는다. 화면에 박아 두면 서버 설정을 바꿔도
// 화면은 옛 값을 보내서 둘이 조용히 어긋난다.
fetch('/api/defaults').then(r => r.json()).then(d => {
  if (d.method) $('#method').value = d.method;
  if (d.conf != null) $('#conf').value = d.conf;
  if (d.imgsz != null) {
    if (![...$('#imgsz').options].some(o => +o.value === d.imgsz))
      $('#imgsz').add(new Option(d.imgsz, d.imgsz));
    $('#imgsz').value = d.imgsz;
  }
  if (d.batch_size != null) $('#batch').value = d.batch_size;
  if (d.keep_audio != null) $('#audio').checked = !!d.keep_audio;
  $('#dsum').textContent =
    `(기본 ${d.method} · conf ${d.conf} · ${d.imgsz} · batch ${d.batch_size})`;
}).catch(() => { $('#dsum').textContent = '(서버 기본값을 쓰지 못함)'; });

setFilter('active');
go2('browser');
loadObjects();
</script>
</body>
</html>
