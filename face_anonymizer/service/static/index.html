<script>
const $ = s => document.querySelector(s);
const go = $('#go');
// 기본 목록은 '진행중'(수행중 + 대기) 이다. 끝난 것을 같이 섞으면 수백 건짜리
// 배치에서 지금 할 일이 완료 기록에 파묻힌다 — 완료는 완료 탭에서 본다.
let timer = null, filter = 'active', page = 0, pageSize = 5, lastJobsHtml = '';

function fmt(s) {
  // 값이 없으면 'NaN:NaN' 이 아니라 '—' 이어야 한다. 옛 기록에는 빠진 항목이 있다.
  if (!Number.isFinite(s)) return '—';
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`
           : `${m}:${String(x).padStart(2,'0')}`;
}
function humanSize(b) {
  if (b == null) return '—';
  const u = ['B','KB','MB','GB','TB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return `${b.toFixed(i ? 1 : 0)} ${u[i]}`;
}
function humanTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso); if (isNaN(d)) return '—';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} `
       + `${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ── S3 브라우저 ────────────────────────────────────────────────────────────
//
// 서버 계약:
//   GET /api/s3/objects?prefix=videos/2026-08/
//     -> { bucket, prefix, folders:["videos/2026-08/raw/"],
//          objects:[{key, size, modified, processed?}] }
//   POST /api/jobs (form) s3_key=<key> + 기존 옵션
//
// 연결 전이면 404 가 온다. 안내만 띄우고 직접 업로드로 쓸 수 있게 둔다.
const S3 = { bucket:'', prefix:'', folders:[], objects:[], selected:new Set(), error:null };
const VIDEO_RE = /\.(mp4|mov|mkv|avi|webm|m4v)$/i;

async function loadObjects(prefix) {
  if (prefix !== undefined) { S3.prefix = prefix; S3.selected.clear(); }
  try {
    const r = await fetch('/api/s3/objects?prefix=' + encodeURIComponent(S3.prefix));
    if (!r.ok) throw new Error(r.status === 404 ? 'not-configured' : 'HTTP ' + r.status);
    const d = await r.json();
    S3.bucket = d.bucket || ''; S3.folders = d.folders || [];
    S3.objects = d.objects || []; S3.error = null;
  } catch (e) {
    S3.error = e.message; S3.folders = []; S3.objects = [];
  }
  renderBrowser();
}

function crumbs() {
  const el = $('#crumb');
  if (!S3.bucket) { el.innerHTML = '<span class="cur">S3</span>'; return; }
  const parts = S3.prefix.split('/').filter(Boolean);
  let acc = '';
  const items = [`<a onclick="loadObjects('')">${S3.bucket}</a>`];
  parts.forEach((p, i) => {
    acc += p + '/'; const path = acc;
    items.push(i === parts.length - 1 ? `<span class="cur">${p}</span>`
                                      : `<a onclick="loadObjects('${path}')">${p}</a>`);
  });
  el.innerHTML = items.join('<span class="sep">/</span>');
}

function renderBrowser() {
  crumbs();
  const el = $('#browser');
  if (S3.error === 'not-configured') {
    el.innerHTML = `<div class="empty">S3 가 연결되지 않았습니다<br>
      <span style="font-size:11.5px">직접 업로드로 처리할 수 있습니다</span></div>`;
    return updatePicked();
  }
  if (S3.error) {
    el.innerHTML = `<div class="empty">목록을 불러오지 못했습니다 (${S3.error})</div>`;
    return updatePicked();
  }
  // **자모가 분리된 이름(NFD)은 그냥 비교하면 안 잡힌다.** 사람이 치는 글자는
  // 합쳐진 형태라 바이트가 다르다 — 눈에는 똑같은데 파일이 안 나온다. 맥에서
  // 올린 한글 이름이 그렇다. 양쪽을 같은 형태로 맞춘 뒤에 비교한다.
  const q = norm($('#q').value);
  const folders = S3.folders.filter(f => norm(f).includes(q));
  const objects = S3.objects.filter(o => norm(o.key).includes(q));
  if (!folders.length && !objects.length) {
    el.innerHTML = '<div class="empty">항목이 없습니다</div>';
    return updatePicked();
  }
  // 폴더도 파일과 똑같이 체크해서 고른다. 폴더를 고르면 그 안의 영상 전부가
  // 들어간다 — 별도의 '폴더 전체 제출' 버튼을 두면 같은 일에 버튼이 둘이 된다.
  const selectable = folders.concat(objects.filter(o => VIDEO_RE.test(o.key))
                                           .map(o => o.key));
  const allSel = selectable.length && selectable.every(k => S3.selected.has(k));

  const rows = folders.map(f => {
    const name = f.replace(S3.prefix, '').replace(/\/$/, '');
    const sel = S3.selected.has(f);
    return `<tr class="${sel ? 'sel' : ''}">
      <td><input type="checkbox" ${sel ? 'checked' : ''}
            onchange="toggle('${f}', this.checked)"></td>
      <td><div class="key"><span class="ico">▸</span>
        <span class="nm"><a onclick="loadObjects('${f}')">${name}/</a></span></div></td>
      <td class="num">—</td><td class="when">—</td>
      <td><span class="tag plain">폴더</span></td></tr>`;
  }).concat(objects.map(o => {
    const name = o.key.replace(S3.prefix, '');
    const isVideo = VIDEO_RE.test(o.key), sel = S3.selected.has(o.key);
    const tag = o.processed ? '<span class="tag done">처리됨</span>'
              : (isVideo ? '' : '<span class="tag plain">영상 아님</span>');
    return `<tr class="${sel ? 'sel' : ''}">
      <td>${isVideo ? `<input type="checkbox" ${sel ? 'checked' : ''}
            onchange="toggle('${o.key}', this.checked)">` : ''}</td>
      <td><div class="key"><span class="ico">▤</span>
        <span class="nm" title="${o.key}">${name}</span></div></td>
      <td class="num">${humanSize(o.size)}</td>
      <td class="when">${humanTime(o.modified)}</td>
      <td>${tag}</td></tr>`;
  }));

  el.innerHTML = `<table><thead><tr>
      <th style="width:38px">${selectable.length
        ? `<input type="checkbox" ${allSel ? 'checked' : ''}
             onchange="toggleAll(this.checked)">` : ''}</th>
      <th>이름</th><th style="width:88px;text-align:right">크기</th>
      <th style="width:132px">마지막 수정</th><th style="width:86px"></th>
    </tr></thead><tbody>${rows.join('')}</tbody></table>`;
  updatePicked();
}

const isFolder = k => k.endsWith('/');
function toggle(key, on) { on ? S3.selected.add(key) : S3.selected.delete(key); renderBrowser(); }
function toggleAll(on) {
  const q = norm($('#q').value);
  S3.folders.filter(f => norm(f).includes(q))
    .forEach(f => on ? S3.selected.add(f) : S3.selected.delete(f));
  S3.objects.filter(o => VIDEO_RE.test(o.key) && norm(o.key).includes(q))
    .forEach(o => on ? S3.selected.add(o.key) : S3.selected.delete(o.key));
  renderBrowser();
}
function split() {
  const all = [...S3.selected];
  return { files: all.filter(k => !isFolder(k)), dirs: all.filter(isFolder) };
}
function updatePicked() {
  const { files, dirs } = split();
  const bits = [];
  if (files.length) bits.push(`영상 <b>${files.length}개</b>`);
  if (dirs.length) bits.push(`폴더 <b>${dirs.length}개</b>`);
  $('#picked').innerHTML = bits.length ? bits.join(' · ') + ' 선택됨'
                                       : '선택된 항목 없음';
  go.disabled = !bits.length;
}

// ── 제출 ───────────────────────────────────────────────────────────────────
// 서버가 RFC 9457 problem+json 을 준다. title/detail/hint 를 그대로 보여 주면
// "왜 안 되는지" 와 "무엇을 하면 되는지" 가 같이 전달된다.
function problemText(p) {
  if (!p || !p.title) return '알 수 없는 오류가 발생했습니다';
  return [p.title, p.detail, p.hint].filter(Boolean).join('\n');
}
function explain(status, text) {
  let p = null; try { p = JSON.parse(text); } catch (_) {}
  return p && p.title ? problemText(p) : (text || `HTTP ${status}`);
}
// 제출 진입점은 POST /api/jobs 하나다. 한 건이든 여러 건이든 폴더든 같은 요청,
// 같은 응답 — 화면에서도 분기가 필요 없다.
async function submitJobs(body, label) {
  go.disabled = true;
  const was = go.textContent;
  go.textContent = label;
  const r = await fetch('/api/jobs', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, params: paramObject() }),
  });
  go.textContent = was;

  if (r.status !== 202) { alert(explain(r.status, await r.text())); poll();
                          updatePicked(); return; }
  const d = await r.json();
  S3.selected.clear(); renderBrowser();
  // 제출했으면 다음에 볼 것은 진행 상황이다. 브라우저에 남겨 두면 방금 넣은
  // 것이 어떻게 되고 있는지 보려고 사이드바를 한 번 더 눌러야 한다.
  if (d.accepted && d.accepted.length) setFilter('active');
  else poll();
  const notes = (d.notes || []).join('\n');
  if (d.rejected && d.rejected.length) {
    alert(`${d.accepted.length}건 접수, ${d.rejected.length}건은 넣지 못했습니다\n\n`
      + d.rejected.map(x => `${x.s3_key}\n  ${problemText(x.error)}`).join('\n\n')
      + (notes ? `\n\n${notes}` : ''));
  } else if (notes) {
    // 실패가 아니라 알림이다. 거절이 없을 때도 이건 한 번은 말해 준다 —
    // 안 그러면 나중에 "검색해도 안 나온다" 로만 겪는다.
    alert(`${d.accepted.length}건 접수했습니다.\n\n${notes}`);
  }
}

go.onclick = () => {
  const { files, dirs } = split();
  if (!files.length && !dirs.length) return;
  const skip = $('#skipdone').checked;

  // 폴더는 안에 몇 개가 들었는지 화면에 안 보인다. 그것만 한 번 확인받는다.
  if (dirs.length) {
    const lines = [`선택한 항목을 비식별화합니다.`, ''];
    dirs.forEach(d => lines.push(`폴더   ${d}`));
    if (files.length) lines.push(`영상   ${files.length}개`);
    lines.push('', `이미 처리된 건  ${skip ? '건너뜀' : '다시 처리'}`);
    if (!confirm(lines.join('\n'))) return;
  }
  const label = dirs.length ? '제출 중…' : `제출 중… ${files.length}건`;
  return submitJobs({ s3_keys: files, s3_prefix: dirs, skip_processed: skip },
                    label);
};

function paramObject() {
  return { method: $('#method').value, conf: +$('#conf').value,
           imgsz: +$('#imgsz').value, batch_size: +$('#batch').value,
           keep_audio: $('#audio').checked };
}
$('#q').addEventListener('input', renderBrowser);

// '수행중' 은 따로 두지 않는다. **진행중 = 수행중 + 대기** 라서 바로 밑 두
// 항목의 합일 뿐이고, GPU 를 직렬화하므로 수행중은 **항상 0 아니면 1건**이다.
// 탭 하나가 카드 한 장을 보여 주는 셈인데, 그 한 장은 진행중 목록 맨 위에 이미
// 있고 지금 도는 작업의 진행률·단계·속도는 사이드바 HUD 가 항상 띄운다.
// 상태 자체는 남아 있다 — API 는 ?status=running 을 그대로 받는다.
const FILTER_TEXT = { active:'진행중', queued:'대기',
                      review:'검수 필요', done:'완료', failed:'실패' };
const NAV_KEYS = ['active', 'queued', 'review', 'done', 'failed', ''];
const VIEW_TITLE = { overview:'현황', browser:'파일 브라우저', jobs:'작업',
                     logs:'로그' };
const VIEWS = ['overview', 'browser', 'jobs', 'logs'];
let view = 'browser', lastOverview = 0;

// 사이드바가 목록 필터 하나만 바꾸면 사이드바를 둘 이유가 없다. 화면을 실제로
// 바꾼다 — 현황은 버킷 기준 진척률과 큐·자원, 로그는 시간 축, 나머지 둘은 하던 일.
function go2(v) {
  view = v;
  paintNav();
  $('#page').textContent = VIEW_TITLE[v];
  $('#view-overview').hidden = v !== 'overview';
  $('#view-logs').hidden = v !== 'logs';
  $('#view-work').hidden = v === 'overview' || v === 'logs';
  // **파일 브라우저와 작업 목록을 한 화면에 두지 않는다.**
  //
  // 예전에는 브라우저 옆에 목록이 붙어 있어서, 사이드바에서 상태를 눌러도
  // 브라우저 화면에 머문 채 옆칸만 바뀌었다. 무슨 화면을 보고 있는 건지가
  // 흐려지고, 고르는 일과 지켜보는 일이 한 화면에서 섞인다.
  $('#card-browser').hidden = v !== 'browser';
  $('#card-jobs').hidden = v !== 'jobs';
  $('#view-work').classList.toggle('solo', true);
  // 로그는 작업 상태 KPI 와 아무 상관이 없다. 남겨 두면 위쪽 숫자와 아래쪽
  // 목록이 서로 다른 이야기를 해서 화면이 두 개인 것처럼 읽힌다.
  $('#kpis').hidden = v !== 'jobs';
  if (v === 'overview') loadOverview();
  if (v === 'logs') { renderColChips(); loadLogBatches(); loadLogDays(); loadLogs(); }
  poll();
}

// ---------------------------------------------------------------------------
// 로그 — **시간 축.** 작업 목록이 "지금 어떤가" 라면 이쪽은 "무슨 일이 있었나" 다.
//
// 문장은 서버가 만들어 준다(events.decorate). 여기서 만들면 로그 파일과 화면이
// 다른 말을 하게 되고, 나중에 화면이 하나 더 붙으면 같은 계산을 또 짜게 된다.
const LOG_PAGE = 60;
let logRows = [], logCursor = null, logMore = false, logTimer = null, logOpen = '';

let logBatches = [];          // 고른 폴더들. 비어 있으면 전체다.

function logFilterParams() {
  const p = [];
  const e = $('#lgevent').value, m = $('#lgmode').value, q = $('#lgq').value.trim();
  const f = $('#lgfrom').value, t = $('#lgto').value;
  if (e) p.push('event=' + encodeURIComponent(e));
  if (m) p.push('mode=' + m);
  if (q) p.push('q=' + encodeURIComponent(q));
  if (f) p.push('from_day=' + f);
  if (t) p.push('to_day=' + t);
  for (const b of logBatches) p.push('batch=' + encodeURIComponent(b));
  return p;
}

// 자주 쓰는 기간을 한 번에. 날짜를 두 번 고르게 하면 "오늘 것만" 을 보려고도
// 달력을 두 번 열어야 한다.
function pickDays(n) {
  // 기간이 바뀌면 그 기간에 돈 폴더만 남아야 한다.
  if (n === null) { $('#lgfrom').value = ''; $('#lgto').value = ''; }
  else {
    const end = new Date(), start = new Date();
    start.setDate(end.getDate() - n);
    const fmtd = d => d.toISOString().slice(0, 10);
    $('#lgfrom').value = fmtd(start);
    $('#lgto').value = fmtd(end);
  }
  loadLogBatches();
  logFilterChanged();
}

// 기록이 있는 날의 범위를 알려 준다 — 없는 날을 골라 놓고 "왜 비었지" 하지
// 않게. 저널은 날짜별 파일이라 목록을 바로 뽑을 수 있다.
async function loadLogDays() {
  const r = await fetch('/api/events/days').then(r => r.ok ? r.json() : null)
    .catch(() => null);
  const days = (r && r.days) || [];
  $('#lgdaysum').textContent = days.length
    ? `기록 ${days[days.length - 1]} ~ ${days[0]} (${days.length}일)` : '';
  for (const id of ['#lgfrom', '#lgto']) {
    if (days.length) {
      $(id).min = days[days.length - 1];
      $(id).max = days[0];
    }
  }
}

function logQuery(before) {
  const p = logFilterParams();
  p.unshift('limit=' + LOG_PAGE);
  if (before) p.push('before=' + before);
  return p.join('&');
}

// 내보내기는 **화면에 걸린 조건 그대로** 나간다. 전용 조건을 따로 두면 화면에서
// 거른 것과 파일에 담긴 것이 달라지고, 그걸 알아채는 건 파일을 연 뒤다.
function exportLogs() {
  location.href = '/api/export.csv?' + logFilterParams().join('&');
}

async function loadLogBatches() {
  // 작업 목록이 아니라 **저널**에서, 그리고 **지금 걸린 기간 안에서** 받는다.
  // 저널은 지워지지 않아 버킷을 재편하면 없어진 폴더 이름이 영원히 남는다.
  const f = $('#lgfrom').value, t = $('#lgto').value;
  const q = [f && 'from_day=' + f, t && 'to_day=' + t].filter(Boolean).join('&');
  const r = await fetch('/api/events/batches' + (q ? '?' + q : ''))
    .then(r => r.ok ? r.json() : null).catch(() => null);
  const names = (r && r.batches || []).filter(Boolean);
  // 기간이 좁아지면서 고른 폴더가 목록에서 사라질 수 있다. 그대로 두면 화면이
  // 비는데 왜 비었는지가 안 보인다.
  const gone = logBatches.filter(b => !names.includes(b));
  if (gone.length) logBatches = logBatches.filter(b => names.includes(b));
  const el = $('#lgbatches');
  el.hidden = !names.length;                 // 폴더로 돌린 적이 없으면 줄 자체를 숨긴다
  if (!names.length) return;
  el.innerHTML = `<span class="n" style="margin:0 6px 0 0">폴더</span>` +
    `<span class="bchip ${logBatches.length ? '' : 'on'}"
           onclick="pickBatch('')">전체</span>` +
    names.map(n => `<span class="bchip ${logBatches.includes(n) ? 'on' : ''}"
        onclick="pickBatch('${n}')">${esc(n)}</span>`).join('');
}

function pickBatch(name) {
  if (!name) logBatches = [];                          // '전체'
  else if (logBatches.includes(name))
    logBatches = logBatches.filter(b => b !== name);    // 다시 누르면 해제
  else logBatches.push(name);
  loadLogBatches();
  logFilterChanged();
}

async function loadLogs(append) {
  const r = await fetch('/api/events?' + logQuery(append ? logCursor : null))
    .then(r => r.json()).catch(() => null);
  if (!r) { $('#lgnote').textContent = '불러오지 못했습니다'; return; }
  logRows = append ? logRows.concat(r.events) : r.events;
  logCursor = r.cursor;
  logMore = r.has_more;
  renderLogs();
  scheduleLogs();
}

function scheduleLogs() {
  clearTimeout(logTimer);
  // '더 보기' 로 아래를 펼쳐 놓았거나 한 작업만 열어 둔 상태에서 자동 갱신이
  // 돌면, 방금 펼친 것이 통째로 접히고 전체 목록으로 되돌아간다. 첫 쪽을
  // 그냥 보고 있을 때만 갱신한다.
  if (view === 'logs' && $('#lglive').checked && !logOpen
      && !logOpenRows.size && logRows.length <= LOG_PAGE)
    logTimer = setTimeout(() => loadLogs(), 4000);
}

// 검색·비교용 정규화. 자모 분리(NFD)와 합쳐진 형태(NFC)를 같게 본다.
function norm(s) {
  return String(s || '').normalize('NFC').toLowerCase();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}

function rowKey(r) { return `${r.ts}|${r.event}|${r.job || ''}`; }

// 화면에 그릴 수 있는 열들. 순서가 곧 화면 순서다.
const LOG_COLS = [
  { key:'time',  name:'시각',   draw:r => `<span class="lt">${esc(r.time)}</span>` },
  { key:'mode',  name:'경로',   draw:r =>
      `<span class="lm ${r.mode === 'msa' ? 'msa' : ''}">${esc(r.mode)}</span>` },
  { key:'event', name:'사건',   draw:r =>
      `<span class="lb ${esc(r.tone)}">${esc(r.label)}</span>` },
  { key:'name',  name:'파일명', draw:r =>
      `<span class="ln" title="이 작업만 보기"
             onclick="event.stopPropagation();openLog('${esc(r.job || '')}')"
             style="${r.job ? 'cursor:pointer' : ''}">${esc(r.name || r.job || '')}</span>` },
  { key:'text',  name:'요약',   draw:r => `<span class="lx">${esc(r.text)}</span>` },
  { key:'batch', name:'폴더',   draw:r =>
      r.batch ? `<span class="lg2">${esc(r.batch)}</span>` : '' },
];
const LOG_COLS_DEFAULT = LOG_COLS.map(c => c.key);
let logCols = new Set(LOG_COLS_DEFAULT);

function loadCols() {
  try {
    const saved = JSON.parse(localStorage.getItem('fa.logcols') || 'null');
    if (Array.isArray(saved) && saved.length) logCols = new Set(saved);
  } catch (e) {}
}
function saveCols() {
  try { localStorage.setItem('fa.logcols', JSON.stringify([...logCols])); }
  catch (e) {}
}

function renderColChips() {
  $('#lgcols').innerHTML =
    `<span class="n" style="margin:0 6px 0 0">열</span>` +
    LOG_COLS.map(c => `<span class="bchip ${logCols.has(c.key) ? 'on' : ''}"
        onclick="toggleCol('${c.key}')">${c.name}</span>`).join('') +
    `<span class="bchip" onclick="resetCols()">기본값</span>`;
}

function toggleCol(key) {
  if (logCols.has(key)) logCols.delete(key); else logCols.add(key);
  // 전부 끄면 줄이 빈칸만 남는다. 마지막 하나는 못 끄게 한다.
  if (!logCols.size) logCols.add(key);
  saveCols(); renderColChips(); renderLogs();
}
function resetCols() {
  logCols = new Set(LOG_COLS_DEFAULT);
  saveCols(); renderColChips(); renderLogs();
}

function logLine(r) {
  const k = rowKey(r), open = logOpenRows.has(k);
  const cells = LOG_COLS.filter(c => logCols.has(c.key))
                        .map(c => c.draw(r)).join('');
  return `<div class="lrow ${open ? 'open' : ''}" data-k="${esc(k)}"
       onclick="toggleDetail('${esc(k)}')">
    <span class="lcv">▶</span>${cells}
  </div>${open ? detailHtml(k) : ''}`;
}

// ---------------------------------------------------------------------------
// 상세는 **펼칠 때만** 가져온다.
//
// 목록이 그리는 값은 여섯 칸뿐인데 예전에는 저널 줄을 통째로 받았다. 단계별
// 소요나 경고 원문처럼 펼쳐야 보이는 것까지 60줄에 다 붙어 온 셈이다. 60줄 중
// 사람이 펼치는 건 보통 한둘이라, 그 한둘만 따로 가져오는 편이 훨씬 싸다.
//
// 한 번 받은 것은 들고 있는다. 4초마다 목록을 다시 그리는데 그때마다 다시
// 가져오면 펼쳐 둔 줄이 깜빡인다.
const logDetails = new Map();
let logOpenRows = new Set();

const DETAIL_LABEL = {
  seconds:'소요(초)', elapsed_s:'경과(초)', frames:'프레임',
  detected_frames:'검출 프레임', detection_rate:'검출률',
  realtime_factor:'실시간 대비', raw_boxes:'검출 박스', filled_boxes:'보간',
  source_codec:'원본 코덱', transcoded:'전사', attempts:'시도',
  stage:'단계', transient:'일시적', percent:'진행률', eta_s:'남은(초)',
  action:'판정', note:'사유', job:'작업 id', queue:'큐', cold_s:'기동(초)',
  done:'성공', failed:'실패', avg_elapsed_s:'평균(초)', started_at:'시작',
  finished_at:'종료', span:'구간', review_needed:'검수 필요',
};
const DETAIL_SKIP = new Set(['at', 'ts', 'mode', 'event', 'name', 'batch',
                             'label', 'text', 'tone', 'time', 'timing']);
const TIMING_LABEL = { ingest:'인제스트', detect:'검출', track:'추적',
                       render:'렌더', audio:'최종', total:'합계' };

function detailHtml(k) {
  const d = logDetails.get(k);
  if (!d) return `<div class="ldet">불러오는 중…</div>`;
  if (d.error) return `<div class="ldet">상세를 가져오지 못했습니다</div>`;
  const r = d.raw || {};
  const kv = Object.entries(r)
    .filter(([key, v]) => !DETAIL_SKIP.has(key) && v !== null && v !== '')
    .map(([key, v]) => {
      let out = v;
      if (key === 'detection_rate') out = (v * 100).toFixed(2) + '%';
      else if (typeof v === 'boolean') out = v ? '예' : '아니오';
      else if (Array.isArray(v)) out = v.join(', ') || '—';
      else if (typeof v === 'object') return '';
      return `<div><span>${DETAIL_LABEL[key] || key}</span>
        <b title="${esc(out)}">${esc(out)}</b></div>`;
    }).filter(Boolean).join('');
  // 단계별 소요는 따로 — 어디가 느렸는지가 한눈에 보여야 한다.
  const t = r.timing || {};
  const timing = Object.keys(t).length
    ? `<div class="kv">${Object.entries(t).map(([key, v]) =>
        `<div><span>${TIMING_LABEL[key] || key}</span><b>${v}초</b></div>`
      ).join('')}</div>` : '';
  return `<div class="ldet">
    ${kv ? `<div class="kv">${kv}</div>` : ''}${timing}
    <pre>${esc(JSON.stringify(r, null, 1))}</pre></div>`;
}

async function toggleDetail(k) {
  if (logOpenRows.has(k)) { logOpenRows.delete(k); return renderLogs(); }
  logOpenRows.add(k);
  renderLogs();
  if (logDetails.has(k)) return;
  const [ts, event, job] = k.split('|');
  const p = ['ts=' + encodeURIComponent(ts)];
  if (event) p.push('event=' + encodeURIComponent(event));
  if (job) p.push('job=' + encodeURIComponent(job));
  const r = await fetch('/api/events/detail?' + p.join('&'))
    .then(r => r.ok ? r.json() : { error: true }).catch(() => ({ error: true }));
  logDetails.set(k, r);
  if (logOpenRows.has(k)) renderLogs();
}

// 작업 단위로 묶기. 같은 파일에 대한 사건이 시간순으로 흩어져 있으면 "이 파일이
// 어떻게 됐나" 를 눈으로 이어 붙여야 한다. 묶어 두면 한 덩이가 한 파일이다.
function groupLogs(rows) {
  const order = [], byJob = new Map();
  for (const r of rows) {
    const k = r.job || '(작업 없음)';
    if (!byJob.has(k)) { byJob.set(k, []); order.push(k); }
    byJob.get(k).push(r);
  }
  return order.map(k => {
    const list = byJob.get(k);
    const fin = list.find(r => r.event === 'job.finished');
    const bad = list.find(r => r.event === 'job.failed');
    const head = fin || bad || list[0];
    const tone = bad ? 'bad' : '';
    const sub = bad ? bad.text : (fin ? fin.text : `${list.length}건`);
    return `<div class="lgroup">
      <div class="lhead"><span>${esc(head.name || k)}</span>
        ${head.batch ? `<span class="sub">${esc(head.batch)}</span>` : ''}
        <span class="sub ${tone}">${esc(sub)}</span>
        <span class="sub" style="margin-left:auto">${esc(head.mode)}</span></div>
      ${list.map(logLine).join('')}</div>`;
  }).join('');
}

function renderLogs() {
  const grouped = $('#lggroup').checked;
  $('#lgnote').textContent = logOpen
    ? '한 작업만 보는 중 — 같은 줄을 다시 누르면 전체로'
    : (logRows.length ? `${logRows.length}줄${logMore ? ' (더 있음)' : ''}` : '');
  if (!logRows.length) {
    $('#logs').innerHTML = `<div class="empty">기록이 없습니다.
      작업을 한 건 돌리면 여기에 쌓입니다.</div>`;
    return;
  }
  const body = grouped ? groupLogs(logRows) : logRows.map(logLine).join('');
  const more = logMore
    ? `<div class="pager"><button class="ghost" onclick="loadLogs(true)">더 보기</button></div>`
    : '';
  $('#logs').innerHTML = body + more;
}

// 한 작업만 따로 본다. 게시판에서 글 하나를 여는 것과 같다 — 그 파일에 무슨
// 일이 있었는지 처음부터 끝까지가 한 화면에 온다.
function openLog(job) {
  if (logOpen === job) {           // 같은 줄을 다시 누르면 전체로 돌아간다
    logOpen = ''; $('#lgq').value = ''; return loadLogs();
  }
  logOpen = job;
  $('#lggroup').checked = true;
  scheduleLogs();                  // 돌고 있던 자동 갱신을 멈춘다 (logOpen 이므로)
  fetch('/api/events?limit=200&job=' + encodeURIComponent(job))
    .then(r => r.json()).then(r => {
      logRows = r.events; logCursor = r.cursor; logMore = false;
      renderLogs();
    }).catch(() => {});
}

// 필터를 바꾸면 처음부터 다시 읽는다. 커서(before)를 들고 있으면 새 조건에
// 옛 커서가 붙어서 중간부터 나온다.
let logDebounce = null;
function logFilterChanged(delay) {
  logOpen = ''; logCursor = null; logOpenRows = new Set();
  clearTimeout(logDebounce);
  logDebounce = setTimeout(() => loadLogs(), delay || 0);
}
$('#lgevent').onchange = () => logFilterChanged();
$('#lgmode').onchange = () => logFilterChanged();
$('#lgq').oninput = () => logFilterChanged(250);   // 한 글자마다 때리지 않는다
$('#lgfrom').onchange = () => { loadLogBatches(); logFilterChanged(); };
$('#lgto').onchange = () => { loadLogBatches(); logFilterChanged(); };
$('#lggroup').onchange = renderLogs;               // 이미 받은 줄을 다시 그리기만
$('#lglive').onchange = scheduleLogs;

// 진척률은 **제출한 폴더**를 따라간다. 화면이 범위를 정하지 않는다 —
// 어느 폴더를 돌릴지는 파일 브라우저에서 이미 골랐고, 그 선택이 곧 이 화면의
// 대상이다. 서버가 제출 시점에 기록하므로 여기서 넘겨줄 것이 없다.
async function untrackFolder(prefix) {
  if (!confirm(`'${prefix}' 를 진척률 목록에서 뺄까요?\n버킷의 파일은 그대로 두고 화면에서만 사라집니다.`))
    return;
  await fetch('/api/s3/progress?prefix=' + encodeURIComponent(prefix),
              { method: 'DELETE' }).catch(() => {});
  loadOverview();
}

async function loadOverview() {
  lastOverview = Date.now();
  loadStorage();
  const [m, p, b] = await Promise.all([
    fetch('/api/metrics').then(r => r.json()).catch(() => null),
    fetch('/api/s3/progress').then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('/api/batches').then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  renderProgress(p);
  renderOps(m);
  renderBatches(b);
}

// 폴더 단위로 언제 시작해서 언제 끝났나. 사람이 묻는 단위가 파일이 아니라
// 폴더인 경우가 많다 — "kbs 언제 시작해서 언제 끝났어?"
function renderBatches(b) {
  const rows = (b && b.batches) || [];
  const el = $('#batches');
  if (!el) return;
  $('#card-batches').hidden = !rows.length;
  if (!rows.length) return;
  el.innerHTML = rows.map(r => `
    <div class="job ${r.remain ? '' : 'ok'}">
      <div class="jhead"><div class="jname">${r.batch}</div>
        <span class="tag ${r.remain ? 'run' : 'done'}">${
          r.remain ? `진행중 ${r.percent}%` : '완료'}</span></div>
      <div class="bar2"><i style="width:${r.percent}%"></i></div>
      <div class="meta">${r.span}</div>
      <div class="meta">전체 ${r.total}건 · 완료 ${r.done}${
        r.failed ? ` · 실패 ${r.failed}` : ''}${r.remain ? ` · 남음 ${r.remain}` : ''}</div>
    </div>`).join('');
}

// 저장소 — **지금 어디에 붙어 있나.** 열쇠 값은 여기 절대 안 온다. 어디서
// 왔는지만 온다(인스턴스 역할·환경 변수·화면). 아직 아무것도 안 정해졌으면
// 읽기 전용 표 대신 **고르는 화면**이 나온다 — 처음 들어온 사람이 터미널을
// 먼저 쳐야 한다면 그건 가져다 쓸 수 있는 물건이 아니다.
let STORAGE = null;

async function loadStorage() {
  const d = await fetch('/api/storage').then(r => r.ok ? r.json() : null)
    .catch(() => null);
  if (!d) { $('#conn').hidden = true; return; }
  STORAGE = d;
  paintConn(d);
  // 팝오버가 열려 있으면 그 안도 같이 새로 그린다 — 열어 둔 채 폴링이 돌면
  // 화면과 실제가 조용히 갈린다.
  if (!$('#connpop').hidden) $('#connpop').innerHTML = connPanel(d);
}

// 상단 한 줄. **평소에 필요한 건 '어디에 붙어 있나' 뿐이다.**
function paintConn(d) {
  const b = $('#conn'), c = d.current;
  b.hidden = false;
  b.classList.toggle('off', !c.ready);
  b.innerHTML = c.ready
    ? `<span class="dot"></span>${esc(c.name)} 연결됨
       <span style="color:var(--faint)">${esc(c.bucket)}</span>`
    : `<span class="dot"></span>연결 안 됨`;
}

function toggleConn() {
  const el = $('#connpop');
  el.hidden = !el.hidden;
  if (!el.hidden) el.innerHTML = connPanel(STORAGE);
}

// 눌렀을 때 나오는 자세한 내용. 예전의 저장소 카드가 여기로 들어왔다.
function connPanel(d) {
  const c = d.current, w = d.weights || {};
  return storageView(d) + `
    <div style="margin-top:14px;display:flex;gap:8px;align-items:center">
      <button class="ghost" onclick="testStorage()">연결 확인</button>
      ${d.editable
        ? `<button class="ghost" onclick="disconnectStorage()"
                   style="color:var(--critical-ink);border-color:#f2c9c9">
             연결 해제</button>`
        : ''}
      <span class="meta" style="margin-left:auto">${
        esc(modelState(LAST_STATUS).text)}</span>
    </div>`;
}

// **연결을 끊는 것은 되돌리기 어려운 일이 아니다** — 버킷은 그대로다. 다만
// 무엇이 끊기는지는 먼저 말한다. '이미 처리했나' 판정이 결과 버킷 대조라,
// 다른 곳에 붙으면 처리한 것이 전부 미처리로 보인다.
async function disconnectStorage() {
  const c = STORAGE.current;
  if (!confirm(
      `${c.name} / ${c.bucket} 연결을 끊을까요?\n\n` +
      `버킷의 파일은 그대로 있습니다. 끊으면 처음 화면으로 돌아가서 다른 ` +
      `클라우드나 다른 버킷에 붙을 수 있습니다.\n\n` +
      `다만 '이미 처리했나' 판정은 결과 버킷을 대조해서 하기 때문에, 다른 ` +
      `곳에 붙으면 여기서 처리한 것들이 전부 미처리로 보입니다.`))
    return;
  const r = await fetch('/api/storage', { method: 'DELETE' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(problemText(j) || '연결을 끊지 못했습니다'); return; }
  $('#connpop').hidden = true;
  const d = await fetch('/api/storage').then(x => x.json());
  document.querySelector('.app').hidden = true;    // 처음 화면으로 되돌아간다
  openSetup(d);
}

// 자세히 — 지금 붙어 있는 곳의 값들.
function storageView(d) {
  const c = d.current;
  const rows = [
    ['제공자', c.name],
    ['버킷', c.bucket || '—'],
    ['엔드포인트', c.endpoint || '기본 (리전으로 정해짐)'],
    ['리전', c.region || '기본'],
    ['입력 프리픽스', c.root_prefix || '(최상위)'],
    ['결과 프리픽스', c.output_prefix || '—'],
    ['자격 증명', (d.credentials || {}).source || '—'],
    ['가중치 파일', (d.weights || {}).present
      ? `있음 (${d.weights.size_mb} MB)` : ((d.weights || {}).detail || '—')],
  ];
  return `
    <div class="kv">${rows.map(([k, v]) =>
      `<div><span>${k}</span><b title="${esc(v)}">${esc(v)}</b></div>`).join('')}</div>
    ${d.reason ? `<div class="warn" style="margin-top:10px">${esc(d.reason)}</div>` : ''}
    ${d.lock_reason ? `<div class="meta" style="margin-top:10px">${
      esc(d.lock_reason)}</div>` : ''}`;
}

// 첫 실행 — 여기서 정한다. 열쇠 칸은 **이미 있으면 안 보여 준다.** 대부분은
// 인스턴스 역할이나 aws configure 로 이미 있어서, 물어보면 오히려 헷갈린다.
function storageForm(d, opts) {
  const c = d.current, cr = d.credentials || {}, gate = (opts || {}).gate;
  const chips = (d.providers || []).map(p =>
    `<span class="bchip ${p.id === c.provider ? 'on' : ''}" data-pid="${p.id}"
           title="${esc(p.note || '')}"
           onclick="fillProvider('${p.id}')">${esc(p.name)}${
             p.supported ? '' : ' <small>준비 중</small>'}</span>`).join('');
  return `
    ${(d.first_run && !gate) ? `<div class="meta" style="margin-bottom:10px">
      아직 붙을 곳이 정해지지 않았습니다. 아래에서 고르고 저장하시면
      바로 쓰실 수 있습니다. <b>연결이 되는 것을 확인한 뒤에만 저장됩니다.</b>
    </div>` : ''}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">${chips}</div>
    <div class="stgrid">
      <div class="wide"><label>버킷 이름</label>
        <input class="stin" id="stbucket" placeholder="예: my-bucket" autocomplete="off"></div>
      <div class="wide" id="stendrow"><label>엔드포인트 <span id="stendreq"></span></label>
        <input class="stin" id="stendpoint" placeholder="https://…" autocomplete="off"></div>
      <div><label>리전</label>
        <input class="stin" id="stregion" placeholder="예: us-east-1" autocomplete="off"></div>
      <div><label>입력 프리픽스 <span style="color:var(--faint)">(선택)</span></label>
        <input class="stin" id="stroot" placeholder="예: v1/input/ · 비우면 최상위"
               autocomplete="off"></div>
      <div class="wide"><label>결과 프리픽스</label>
        <input class="stin" id="stout" placeholder="예: v1/results/face/" autocomplete="off"></div>
    </div>
    <div class="meta" style="margin-top:12px">
      자격 증명 — <b>${esc(cr.source || '확인 중')}</b></div>
    ${weightsLine(d)}
    ${cr.present ? `<div class="meta" style="margin-top:4px">
        이미 있어서 따로 넣지 않으셔도 됩니다.</div>`
      : !window.isSecureContext ? `<div class="warn" style="margin-top:8px">
        <b>지금 연결이 평문(http)이라 키 입력을 열지 않습니다.</b>
        넣는 즉시 경로 위의 누구나 볼 수 있어서, 받아 두고 안전하다고 말할 수
        없습니다. https 로 접속하시거나 SSH 터널로 같은 기계에서 여시면 열립니다.
        키를 안 넣고 서버 쪽에 인스턴스 역할·<code>aws configure</code> 를
        두는 방법도 있습니다.</div>`
      : `<div class="stgrid" style="margin-top:8px">
      <div><label>액세스 키</label>
        <input class="stin" id="stak" autocomplete="off"></div>
      <div><label>시크릿 키</label>
        <input class="stin" id="stsk" type="password" autocomplete="new-password"></div>
      <div class="wide meta">넣으신 키는 <b>메모리에만</b> 둡니다. 파일에 쓰지
        않고 다시 돌려주지도 않습니다 — 서버를 다시 띄우면 사라지니, 계속
        쓰시려면 저장 뒤에 안내해 드리는 두 줄을 환경에 넣어 주세요.</div>
    </div>`}
    <div id="sterr"></div>
    <div style="margin-top:14px;display:flex;gap:8px;align-items:center">
      <button id="stsave" onclick="saveStorage()">${
        gate ? '연결 확인하고 시작하기' : '연결 확인하고 저장'}</button>
      <span class="meta" id="ststat"></span></div>`;
}

// 모델 가중치는 저장소와 **별개**다. 남의 버킷에는 우리 가중치가 없는 것이
// 정상이라, 없으면 공개 릴리스에서 받는다. 그 사실을 통과 전에 말해 준다 —
// 40MB 를 받는 것이 첫 영상에서 갑자기 일어나면 사람은 그걸 고장으로 읽는다.
function weightsLine(d) {
  const w = d.weights || {};
  if (w.present)
    return `<div class="meta" style="margin-top:4px">모델 가중치 —
      <b>준비됨</b> (${w.size_mb} MB)</div>`;
  return `<div class="meta" style="margin-top:4px">모델 가중치 —
    <b>아직 없습니다.</b> ${esc(w.detail || '')}${
      w.url ? `<br><span style="color:var(--faint)">${esc(w.url)}</span>` : ''}</div>`;
}

// 제공자를 고르면 그 기본값을 채운다 — NCP 를 고르면 주소·리전이 알아서 들어간다.
function fillProvider(pid, cur) {
  const p = (STORAGE.providers || []).find(x => x.id === pid);
  if (!p) return;
  document.querySelectorAll('.bchip[data-pid]').forEach(el =>
    el.classList.toggle('on', el.dataset.pid === pid));
  const c = cur || {};
  const set = (id, v) => { const el = $('#' + id); if (el && v != null) el.value = v; };
  set('stbucket', c.bucket || $('#stbucket')?.value || '');
  // 고른 제공자의 기본 주소로 갈아 준다. 이미 손으로 고친 값이 있어도
  // 제공자를 바꾼 이상 옛 주소가 남아 있는 편이 더 위험하다.
  set('stendpoint', p.endpoint || (cur ? (c.endpoint || '') : ''));
  // **회색 예시는 값이 아니다.** 예전에는 리전 칸에 us-east-1 이 흐리게 떠
  // 있어서 채워진 것처럼 보였고, 그대로 누르면 빈 값이 갔다. 아는 값은 진짜로
  // 채운다 — 제공자가 정해 주는 것(NCP) 이거나, AWS 의 기본 리전이거나.
  set('stregion', p.region || (cur && c.region) || (pid === 's3' ? 'us-east-1' : ''));
  if (cur) { set('stroot', c.root_prefix || ''); set('stout', c.output_prefix || ''); }
  const req = $('#stendreq');
  if (req) req.textContent = p.needs_endpoint ? '(필요합니다)' : '(비우면 기본값)';
  $('#stsave').disabled = !p.supported;
  $('#ststat').textContent = p.supported ? '' : (p.note || '아직 지원하지 않습니다');
}

// 관문을 연다. 통과하기 전에는 본 화면을 아예 안 그린다 — 그려 봐야 0 으로
// 채워진 카드와 404 뿐이고, 그 화면들은 '아직 아니다' 라고 말해 주지 않는다.
function openSetup(d) {
  STORAGE = d;
  $('#setup').hidden = false;
  $('#setup-body').innerHTML = storageForm(d, { gate: true });
  fillProvider(d.current.provider, d.current);
}

function enterApp() {
  $('#setup').hidden = true;
  document.querySelector('.app').hidden = false;
  loadStorage();                           // 상단 연결 표시를 채운다
  go2('browser');
  loadObjects();
}

// 팝오버는 바깥을 누르면 닫힌다. 열어 둔 채 다른 걸 누르면 화면을 가린다.
document.addEventListener('click', e => {
  const pop = $('#connpop');
  if (!pop || pop.hidden) return;
  if (e.target.closest('#connpop') || e.target.closest('#conn')) return;
  pop.hidden = true;
});

async function saveStorage() {
  const pid = document.querySelector('.bchip[data-pid].on')?.dataset.pid || 's3';
  const body = {
    provider: pid,
    bucket: $('#stbucket').value.trim(),
    endpoint: $('#stendpoint').value.trim(),
    region: $('#stregion').value.trim(),
    root_prefix: $('#stroot').value.trim(),
    output_prefix: $('#stout').value.trim(),
  };
  if ($('#stak')?.value) {
    body.access_key = $('#stak').value.trim();
    body.secret_key = $('#stsk').value;
  }
  const btn = $('#stsave');
  btn.disabled = true;
  $('#ststat').textContent = '연결을 확인하는 중…';
  $('#sterr').innerHTML = '';
  const r = await fetch('/api/storage', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  btn.disabled = false;
  $('#ststat').textContent = '';
  if (!r.ok) {
    // **저장은 안 됐다.** 실패했는데 화면만 넘어가면 다음 900건이 허공으로 간다.
    $('#sterr').innerHTML =
      `<div class="warn" style="margin-top:12px">${esc(problemText(j) || '연결하지 못했습니다')}</div>`;
    return;
  }
  const hint = (j.persist_hint || []).length
    ? `\n\n키는 메모리에만 있습니다. 계속 쓰시려면 환경에 넣어 주세요:\n${
        j.persist_hint.join('\n')}`
    : '';
  alert(`연결했습니다 — ${j.detail}\n버킷 ${j.current.bucket}${hint}`);
  enterApp();
}

async function testStorage() {
  const r = await fetch('/api/storage/test', { method: 'POST' });
  const d = await r.json().catch(() => ({}));
  alert(r.ok ? `연결됨 — ${d.detail}\n버킷 ${d.bucket}`
             : (problemText(d) || '연결하지 못했습니다'));
}

function renderProgress(p) {
  const el = $('#prog');
  // 제출한 적 없는 폴더는 여기 나오지 않는다. 예전에는 설정에 박힌 루트 밑을
  // 통째로 훑어서, 한 번도 돌린 적 없는 폴더까지 화면을 채웠다.
  if (!p || !p.folders || !p.folders.length) {
    $('#progsum').textContent = '';
    el.innerHTML = `<div class="empty">아직 처리한 폴더가 없습니다<br>
      <span style="opacity:.8">파일 브라우저에서 폴더를 제출하면 여기에 나타납니다</span>
      </div>`;
    return;
  }
  $('#progsum').textContent = `${p.done} / ${p.total}건`;
  el.innerHTML = p.folders.map(f => {
    const pc = f.percent;
    return `<div class="prow">
      <div class="t"><b>${f.name}</b>
        <span>${f.done} / ${f.total} · 남음 ${f.remain}
          <a onclick="untrackFolder('${f.prefix}')" title="진척률 목록에서 뺍니다"
             style="cursor:pointer;color:var(--faint);margin-left:8px">&times;</a>
        </span></div>
      <div class="track ${pc >= 100 ? 'full' : ''}"><i style="width:${pc}%"></i></div>
    </div>`;
  }).join('');
}

function renderOps(m) {
  const el = $('#opsbody');
  if (!m) { el.innerHTML = '<div class="empty">불러오지 못했습니다</div>'; return; }
  const g = m.gpu;
  const cells = [
    ['대기', `${m.depth}<small>건</small>`, ''],
    // 깊이만 보면 '빨리 빠지는 100건'과 '멈춰 있는 3건'을 구분할 수 없다.
    ['가장 오래 기다린 건', m.depth ? fmt(m.latency) : '—',
      m.latency > 1800 ? 'warnv' : ''],
    ['최근 1시간 처리', `${m.throughput_1h}<small>건</small>`, ''],
    ['최근 1시간 실패', `${m.failed_1h}<small>건</small>`,
      m.failed_1h ? 'warnv' : ''],
    ['평균 처리 시간', m.avg_seconds ? fmt(m.avg_seconds) : '—', ''],
    ['재시도한 작업', `${m.retried}<small>건</small>`, m.retried ? 'warnv' : ''],
  ];
  if (g) cells.push(
    ['GPU 사용률', `${g.util}<small>%</small>`, ''],
    ['GPU 메모리', `${(g.mem_used/1024).toFixed(1)}<small>/${(g.mem_total/1024).toFixed(0)} GB</small>`, ''],
    ['GPU 온도', `${g.temp}<small>°C</small>`, g.temp >= 85 ? 'warnv' : '']);
  cells.push(['디스크 여유',
    m.free_mb != null ? `${(m.free_mb/1024).toFixed(1)}<small>GB</small>` : '—',
    (m.free_mb != null && m.free_mb < m.min_free_mb) ? 'warnv' : '']);

  const head = g ? `<div class="wide"><span>워커</span><b style="font-size:12.5px">${g.name}</b></div>`
                 : `<div class="wide"><span>워커</span><b style="font-size:12.5px">GPU 없음 (CPU 추론)</b></div>`;
  el.innerHTML = `<div class="ops">${head}${cells.map(([k, v, c]) =>
    `<div class="${c}"><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;
}


// 숫자는 목록이 아니라 /api/status 의 집계에서 읽는다. 목록은 100건에서
// 잘리므로 거기서 세면 300건짜리 배치에서 전부 틀린다(docs/issues/006).
function counts(st) { return (st && st.counts) || {}; }

function navCount(st, key) {
  const c = counts(st);
  return key === '' ? (c.total || 0) : (c[key] || 0);
}

function navCounts(st) {
  for (const k of NAV_KEYS)
    document.querySelector('#nav-' + (k || 'all') + ' .c').textContent
      = navCount(st, k) || '';
  $('#c-jobs').textContent = navCount(st, '') || '';
}

// 작업 목록이 실제로 그려지는 화면들. 현황과 로그에는 목록이 없다.
const LIST_VIEWS = ['jobs'];

// **사이드바를 칠하는 일은 여기 한 곳에서만 한다.**
//
// 화면(위)과 작업 상태(아래)를 각자 칠하게 두면 둘 다 켜진 상태가 만들어진다 —
// '현황' 과 '수행중' 이 동시에 파랗게 켜져 있는데 화면은 현황이라, 무엇을 보고
// 있는지 사이드바가 거짓말을 한다. 상태 선택은 목록이 있는 화면에서만 뜻이
// 있으므로, 목록이 없는 화면에서는 아예 끄고 묶음을 흐리게 한다.
function paintNav() {
  const live = LIST_VIEWS.includes(view);
  for (const k of VIEWS)
    document.getElementById('tab-' + k).classList.toggle('on', k === view);
  for (const k of NAV_KEYS)
    document.getElementById('nav-' + (k || 'all'))
      .classList.toggle('on', live && k === filter);
  document.querySelector('nav').classList.toggle('nolist', !live);
}

function setFilter(f) {
  filter = f;
  page = 0;                      // 탭을 바꾸면 첫 페이지부터
  // 목록이 없는 화면에서 상태를 누르면 그 선택이 아무 데도 안 보인다.
  // 누른 사람의 뜻은 "그 목록을 보겠다" 이므로 목록이 있는 화면으로 데려간다.
  if (!LIST_VIEWS.includes(view)) return go2('jobs');
  paintNav();
  poll();
}

function goPage(p) { page = Math.max(0, p); poll(); }

// ── KPI · 상태 박스 · 작업 목록 ────────────────────────────────────────────
const RAD = 24, CIRC = 2 * Math.PI * RAD;
function ring(pct) {
  return `<div class="ringwrap">
    <svg width="58" height="58" viewBox="0 0 58 58">
      <circle class="trk" cx="29" cy="29" r="${RAD}"></circle>
      <circle class="fil" cx="29" cy="29" r="${RAD}"
              stroke-dasharray="${CIRC*pct/100} ${CIRC}"></circle>
    </svg><span class="pct">${Math.round(pct)}%</span></div>`;
}

// 완료 평균도 서버가 센다. 목록 안의 완료 카드를 뒤지면 목록이 잘렸을 때
// 같이 사라져 '기록 없음' 이 된다.
function avgSeconds(st) {
  const r = (st && st.recent) || {};
  return r.avg_seconds || null;
}

// 작업 한 건에 걸리는 시간. 완료 기록이 있으면 그 평균이 제일 정확하고,
// 없으면 지금 도는 작업의 진행률로 되짚는다. 첫 배치에서는 완료가 하나도
// 없으니 평균만 보면 끝날 때까지 '계산 중' 이다 — 그게 이 화면의 버그였다.
//
// overall 은 이제 전 단계를 한 자로 잰다(progress.py). 예전처럼 검출·렌더만
// 세면 전사에 쓴 시간이 분자에만 들어가서 남은 시간이 몇 배로 부풀었다.
function jobSeconds(st, running) {
  const avg = avgSeconds(st);
  if (avg) return avg;
  if (running && running.overall >= 5 && running.job_elapsed > 0)
    return running.job_elapsed * 100 / running.overall;
  return null;
}

function tile(lb, v, sub, cls) {
  return `<div class="tile ${cls || ''}"><div class="lb">${lb}</div>
    <div class="v">${v}</div><div class="sub">${sub || ''}</div></div>`;
}

// 탭마다 다른 숫자를 띄운다. 사이드바를 눌러도 같은 타일 넉 장이 그대로면
// 사이드바가 목록 필터 하나짜리로 되돌아간다 — 화면이 실제로 달라야 한다.
function kpis(jobs, st) {
  const c = counts(st), q = (st && st.queue) || {}, r = (st && st.recent) || {};
  // 수행중은 목록이 아니라 상태에서 받는다 — '완료' 탭을 눌러도 사라지면 안 된다.
  const running = (st && st.running) || jobs.find(j => j.status === 'running');
  const queued = c.queued || 0, done = c.done || 0, failed = c.failed || 0;
  const avg = avgSeconds(st), per = jobSeconds(st, running);
  const disk = st && st.free_mb != null
    ? `디스크 여유 ${(st.free_mb/1024).toFixed(1)} GB` : '';
  let t;

  if (filter === 'queued') {
    t = [
      tile('대기', `${queued}<small>건</small>`,
           queued ? `가장 오래 기다린 건 ${fmt(q.latency || 0)}` : '큐가 비었습니다', 'hero'),
      tile('예상 소요', per != null && queued ? fmt(queued * per) : '계산 중',
           per != null ? `한 건 ${fmt(per)} 기준` : '완료 기록이 쌓이면 계산됩니다'),
      tile('다음 차례', (st && st.next_up && st.next_up[0]) || '—',
           running ? `지금은 ${running.name}` : '유휴'),
      tile('최근 1시간 처리', `${q.throughput_1h || 0}<small>건</small>`,
           q.failed_1h ? `같은 시간 실패 ${q.failed_1h}건` : disk),
    ];

  } else if (filter === 'done') {
    t = [
      tile('완료', `${done}<small>건</small>`,
           avg ? `평균 ${fmt(avg)}` : '기록 없음', 'hero'),
      tile('평균 처리 시간', q.avg_seconds ? fmt(q.avg_seconds) : '—',
           q.slowest_seconds ? `가장 오래 걸린 건 ${fmt(q.slowest_seconds)}` : ''),
      tile('처리 속도', r.realtime_factor ? r.realtime_factor.toFixed(2) : '—',
           '<small>× 실시간</small>'),
      tile('최근 1시간', `${q.throughput_1h || 0}<small>건</small>`, disk),
    ];

  } else if (filter === 'review') {
    // 이 탭이 답해야 하는 질문은 "몇 건이 나를 기다리나" 와 "왜 걸렸나" 다.
    // 처리 속도 같은 건 여기서 아무 의미가 없다.
    const rv = c.review || 0;
    const codes = {};
    for (const j of jobs) for (const i of (j.review || []))
      codes[i.code] = (codes[i.code] || 0) + 1;
    const top = Object.entries(codes).sort((a, b) => b[1] - a[1])[0];
    t = [
      tile('검수 대기', `${rv}<small>건</small>`,
           rv ? '확인 후 완료 또는 반려로 넘겨 주세요' : '확인할 작업이 없습니다', 'hero'),
      tile('가장 흔한 사유', top ? `${top[1]}<small>건</small>` : '—',
           top ? (REVIEW_TEXT[top[0]] || top[0]) : ''),
      tile('완료', `${done}<small>건</small>`,
           avg ? `평균 ${fmt(avg)}` : ''),
      tile('실패', `${failed}<small>건</small>`, disk),
    ];

  } else if (filter === 'failed') {
    t = [
      tile('실패', `${failed}<small>건</small>`,
           failed ? '카드에 단계와 사유가 있습니다' : '실패한 작업이 없습니다', 'hero'),
      tile('최근 1시간 실패', `${q.failed_1h || 0}<small>건</small>`,
           done + failed ? `실패율 ${(100*failed/(done+failed)).toFixed(1)}%` : ''),
      tile('재시도한 작업', `${q.retried || 0}<small>건</small>`,
           `최대 ${(st && st.max_attempts) || ''}회까지 시도합니다`),
      tile('취소됨', `${c.cancelled || 0}<small>건</small>`, disk),
    ];

  } else if (filter === '') {
    t = [
      tile('전체 기록', `${c.total || 0}<small>건</small>`,
           '이 서버가 기억하고 있는 전부입니다', 'hero'),
      tile('완료', `${done}<small>건</small>`, avg ? `평균 ${fmt(avg)}` : ''),
      tile('실패 · 취소', `${failed}<small> · </small>${c.cancelled || 0}`, ''),
      tile('진행중', `${c.active || 0}<small>건</small>`, disk),
    ];

  } else {                                        // active — 기본 화면
    const remain = (running ? 1 : 0) + queued;
    // 수행중 작업은 '이 작업이 끝나기까지'(job_eta), 대기는 한 건 소요 x 건수.
    const etaAll = running && per != null
      ? (running.job_eta || 0) + queued * per : null;
    t = [
      tile('전체 남은 시간',
           etaAll != null ? fmt(etaAll) : (remain ? '계산 중' : '없음'),
           remain ? `남은 작업 ${remain}건` : '처리할 작업이 없습니다', 'hero'),
      // 수행중 탭을 없앴으므로 '이 한 건이 어디까지 왔나' 를 여기서 답한다.
      tile('수행중 · 대기', `${running ? 1 : 0}<small>/</small>${queued}`,
           running ? `${stageText(running)} ${Math.round(running.overall)}%`
                     // 초반 5% 아래에서는 서버가 추정을 안 내놓는다(progress.py).
                     // 그때 0 을 그대로 그리면 '0:00' 이 되어 다 끝난 것처럼 읽힌다.
                     + (running.job_eta ? ` · 남은 ${fmt(running.job_eta)}` : '')
                   : '유휴'),
      tile('완료', `${done}${failed
             ? `<small style="color:var(--critical)"> · 실패 ${failed}</small>` : ''}`,
           avg ? `평균 ${fmt(avg)}` : (per ? `추정 ${fmt(per)}` : '기록 없음')),
      tile('처리 속도',
           `${r.realtime_factor ? r.realtime_factor.toFixed(2) : '—'}<small>× 실시간</small>`,
           disk),
    ];
  }
  $('#kpis').innerHTML = t.join('');
}

// 큐 화면. **무엇이 들어와 있고, 무엇이 돌고, 무엇이 나갔나** 를 한 줄로 본다.
// 카드 목록은 개별 작업을 보는 도구라 큐 전체의 모양은 보여 주지 못한다.
function renderQueue(st) {
  const c = counts(st), q = (st && st.queue) || {}, run = st && st.running;
  const out = (c.done || 0) + (c.failed || 0);
  $('#queuesub').textContent = `들어와 있는 것 ${c.queued || 0}건 · 나간 것 ${out}건`;
  $('#queueui').innerHTML = `
    <div class="flow">
      <div class="box">
        <div class="lb">들어와 있는 것</div>
        <div class="v">${c.queued || 0}<small>건</small></div>
        <div class="sub">${c.queued
          ? `가장 오래 기다린 건 ${fmt(q.latency || 0)}` : '큐가 비었습니다'}</div>
      </div>
      <div class="arw">▶</div>
      <div class="box mid">
        <div class="lb">처리중</div>
        <div class="v" title="${run ? run.name : ''}">${run ? run.name : '유휴'}</div>
        <div class="sub">${run
          ? `${stageText(run)} ${Math.round(run.overall)}% · 남은 ${fmt(run.eta)}`
          : '큐에서 꺼낼 작업이 없습니다'}</div>
      </div>
      <div class="arw">▶</div>
      <div class="box">
        <div class="lb">나간 것</div>
        <div class="v">${c.done || 0}<small>건</small>${c.failed
          ? `<small style="color:var(--critical)"> · 실패 ${c.failed}</small>` : ''}</div>
        <div class="sub">최근 1시간 ${q.throughput_1h || 0}건 · 평균 ${
          q.avg_seconds ? fmt(q.avg_seconds) : '—'}</div>
      </div>
    </div>
    ${(st && st.next_up && st.next_up.length)
      ? `<div class="nextup"><span class="hd">다음 차례</span>${
          st.next_up.map(n => `<span>${n}</span>`).join('')}</div>` : ''}`;
}

// 모델에 관한 사실은 **둘이고 서로 다르다.**
//
//   가중치 파일 — 디스크에 있나 (storage/weights)
//   모델        — 메모리에 올라와서 지금 처리할 수 있나 (worker)
//
// 이 둘을 섞어 쓰다가 화면 세 군데가 서로 다른 말을 했다. 팝오버는 "모델
// 준비됨"(사실은 가중치 파일이 있다는 뜻), 상단 배지는 "모델 준비 중"(기동
// 때 한 번 그린 뒤로 안 바뀜), 사이드바는 "모델을 올리는 중"(이게 맞았다).
// 셋 다 자기 딴에는 맞는 말이라 더 나빴다 — 어느 것을 믿어야 할지가 없다.
//
// 그래서 문구를 여기서 한 번만 정한다. 가중치 파일은 '파일' 이라고 부르고,
// '모델' 이라는 말은 메모리에 올라온 것에만 쓴다.
let LAST_STATUS = null;

function modelState(st) {
  if (!st) return { text: '서버 연결 끊김', ok: false };
  const m = st.model || {};
  if (m.error || st.model_error) return { text: '모델 로드 실패', ok: false };
  if (m.loading) return { text: '모델 올리는 중', ok: false };
  if (m.loaded) return { text: '모델 준비됨', ok: true };
  // **아직 안 올라왔다고 다 '올리는 중' 은 아니다.** 지연 로딩이면 아무것도
  // 하고 있지 않은 것이 정상이고, 그걸 '올리는 중' 이라고 쓰면 거짓말이다 —
  // 실제로 그 문구가 영원히 떠 있는 것을 보고 이 구멍을 찾았다.
  if (m.preload === false)
    return { text: '모델 대기 · 첫 작업 때 올립니다', ok: true, lazy: true };
  return { text: st.ready ? '모델 준비됨' : '모델 올리는 중', ok: !!st.ready };
}

let DEV_SHOWN = false;

function paintDev(st) {
  const el = $('#dev');
  if (!el) return;
  const m = modelState(st);
  if (!m.ok || m.lazy) { el.textContent = m.text; DEV_SHOWN = false; return; }
  if (DEV_SHOWN) return;                   // 장치 정보는 한 번만 받아 온다
  DEV_SHOWN = true;
  fetch('/api/health').then(r => r.json()).then(h => {
    el.textContent = h.model_loaded
      ? `${h.device} · half=${h.half} · imgsz ${h.imgsz}` : m.text;
  }).catch(() => { DEV_SHOWN = false; });
}

function hud(jobs, st) {
  const dot = $('#hdot'), title = $('#htitle'), body = $('#hbody');
  if (!st) {
    dot.className = 'dot err'; title.textContent = '서버 연결 끊김';
    body.innerHTML = '<div class="idle">응답이 없습니다</div>'; return;
  }
  if (!st.ready) {
    // 같은 어휘를 쓴다 — 상단 배지와 여기가 다른 말을 하면 어느 쪽을 믿어야
    // 할지가 없어진다.
    dot.className = 'dot err'; title.textContent = modelState(st).text;
    body.innerHTML = `<div class="idle">${
      st.model_error || '가중치를 올리고 있습니다'}</div>`; return;
  }
  const c = counts(st);
  const running = st.running || jobs.find(j => j.status === 'running');
  const queued = c.queued || 0;
  const remain = (running ? 1 : 0) + queued;
  const avg = avgSeconds(st);

  // 검수 대기는 '진행중'(수행중+대기)에 안 들어간다 — 워커가 할 일이 아니라
  // 사람이 할 일이라서다. 그런데 폴더 진척률은 검수를 '남은 것' 으로 센다.
  // 여기서 그냥 '유휴' 라고 말해 버리면 두 화면이 다른 말을 하고, 사람은
  // "다 됐다는데 왜 남았다고 나오지" 하고 헤맨다.
  const review = c.review || 0;
  dot.className = 'dot ' + (running ? 'run' : (review ? 'warn' : 'ok'));
  title.textContent = running ? `수행중 · 남은 ${remain}건`
                              : (remain ? `대기 ${remain}건`
                                        : (review ? `검수 대기 ${review}건` : '유휴'));
  if (!running) {
    body.innerHTML = `<div class="idle">${
        remain ? '곧 시작합니다'
               : (review ? '<a onclick="setFilter(\'review\')" style="cursor:pointer;'
                           + 'color:var(--accent-ink)">검수 화면에서 확인해 주세요</a>'
                         : '처리할 작업이 없습니다')}</div>
      <div class="hgrid">
        <div><span>대기</span><b>${queued}건</b></div>
        <div><span>디스크</span><b>${st.free_mb != null
          ? (st.free_mb/1024).toFixed(1) + ' GB' : '—'}</b></div>
      </div>`;
    return;
  }
  const stage = stageText(running);
  body.innerHTML = `
    <div class="ring">${ring(running.overall)}
      <div class="who">
        <div class="nm" title="${running.name}">${running.name}</div>
        <div class="st">
          <span class="chip ${running.stage==='detect'?'on':''}">검출</span>
          <span class="chip ${running.stage==='render'?'on':''}">렌더</span>
        </div>
        <div class="st" style="margin-top:3px">${stage} ${running.percent}% ·
          ${running.fps.toFixed(0)} f/s</div>
      </div></div>
    <div class="hgrid">
      <!-- **자를 하나만 쓴다.** 예전에는 여기가 단계 기준(running.eta)이었고
           현황 타일은 작업 기준(job_eta)이어서, 같은 순간에 같은 이름의 값이
           두 가지로 떴다. 사람이 보기에 '이 작업'은 이 영상이 끝나기까지다. -->
      <div><span>이 작업</span><b>${fmt(running.job_eta)}</b></div>
      <div><span>전체</span><b>${avg ? fmt(running.job_eta + queued*avg) : '—'}</b></div>
    </div>`;
}

const WARN_TEXT = { 'no-detections':
  '얼굴이 하나도 검출되지 않았습니다 — 원본이 그대로 출력됐습니다. 임계값을 낮추거나 영상 회전을 확인하세요.',
  'low-detection-rate':
  '검출된 프레임이 매우 적습니다 — 원본이 거의 그대로 나갔을 수 있습니다.',
  'decode-partial': '영상을 끝까지 읽지 못했습니다 — 뒷부분이 빠졌을 수 있습니다.',
  'decode-short': '프레임 수가 원본보다 적습니다.' };

// **경고 문자열에는 수치가 붙는다** — `low-detection-rate: 0.50%` 처럼.
// 통째로 사전을 찾으면 영영 안 맞아서, no-detections 만 한글로 나오고 나머지는
// 영문 원문이 그대로 화면에 떴다. 코드만 떼어 내고 수치는 뒤에 붙여 준다.
function warnText(w) {
  const [code, ...rest] = String(w).split(':');
  const t = WARN_TEXT[code.trim()];
  const num = rest.join(':').trim();
  return t ? (num ? `${t} (${num})` : t) : w;
}

// 검수 사유 코드의 짧은 이름. 카드에는 서버가 준 긴 문장을 쓰고, 여기는
// 타일 한 칸에 들어갈 말이다.
const REVIEW_TEXT = { 'no-detections':'얼굴 검출 0건',
                      'low-detection-rate':'검출률이 매우 낮음',
                      'decode-partial':'영상을 끝까지 읽지 못함',
                      'decode-short':'프레임 수가 원본보다 적음' };
// 단계 이름은 **서버가 준 것을 그대로 쓴다**(`stage_label`). 화면이 자기 표를
// 들고 있으면 갈라진다 — 예전에 여기 있던 표는 MSA 경로와 문구가 달랐고,
// track 이 빠져 있어 추적 중에는 '준비' 라고 떴고, 저장소를 고를 수 있게 된
// 뒤로는 'S3 내려받기' 의 'S3' 도 틀린 말이 됐다.
function stageText(o) {
  return (o && (o.stage_label || o.stage)) || '준비';
}

function card(j) {
  const cls = j.status === 'done' ? 'ok' : '';
  const label = { queued:'대기', running:'수행중', review:'검수 필요', done:'완료',
                  failed:'실패', cancelled:'취소됨' }[j.status] || j.status;
  const tagcls = j.status === 'done' ? 'done'
               : (j.status === 'failed' || j.status === 'cancelled') ? 'err'
               : j.status === 'review' ? 'warnt'
               : j.status === 'running' ? 'run' : '';
  let body = '';
  if (j.status === 'running') {
    const stage = stageText(j);
    body = `<div class="bar2"><i style="width:${j.overall}%"></i></div>
      <div class="meta">${stage} ${j.percent}% · ${j.fps.toFixed(0)} f/s ·
        남은 시간 ${fmt(j.eta)}</div>
      <div class="meta">${j.span || ''}</div>
      <div class="row"><button class="ghost" onclick="cancel('${j.id}')">취소</button></div>`;
  } else if (j.status === 'queued') {
    const retry = j.attempts ? ` · 재시도 ${j.attempts}/${j.max_attempts}` : '';
    // 그냥 '대기' 로 두면 왜 안 도는지 알 수 없다. 기다리는 이유를 적는다.
    const why = { retry: '재시도 대기', defer: '보류' }[j.waiting];
    const head = why ? `${why} · ${fmt(j.wait_left)} 뒤`
                     : `앞에 ${j.queued_ahead}건`;
    const reason = (j.waiting === 'defer' && j.error && j.error.title)
                 ? `<br><span style="opacity:.8">${j.error.title}</span>` : '';
    body = `<div class="bar2"><i style="width:0"></i></div>
      <div class="meta">${head}${retry}${reason}</div>
      <div class="row"><button class="ghost" onclick="cancel('${j.id}')">취소</button></div>`;
  } else if (j.status === 'review') {
    // 처리는 끝났다. 여기서 사람이 보고 넘기기 전까지는 완료가 아니다.
    // 판정 근거(왜 걸렸나)와 판정 수단(볼 수 있는 링크)을 한 자리에 둔다 —
    // 둘 중 하나라도 없으면 사람은 판정을 미루게 된다.
    const r = j.result || {};
    const why = (j.review || []).map(i =>
      `<b>${i.message}</b><br><span style="opacity:.7">${i.detail}</span>`).join('<br><br>');
    body = `<div class="warn">${why || '확인이 필요합니다'}</div>
      <div class="stats">
        <div><span>프레임</span><b>${r.frames ?? '—'}</b></div>
        <div><span>검출</span><b>${r.raw_boxes ?? '—'}</b></div>
        <div><span>검출률</span><b>${r.detection_rate != null
            ? (r.detection_rate * 100).toFixed(1) + '%' : '—'}</b></div>
        <div><span>처리 시간</span><b>${fmt(r.seconds)}</b></div>
      </div>
      <div class="meta" style="margin-top:8px">${j.span || '—'}</div>
      <div class="row">
        <button onclick="event.stopPropagation();watchResult('${j.id}')"
                class="ghost">결과 확인</button>
        <button onclick="review('${j.id}','approve')">완료로 넘기기</button>
        <button class="ghost" onclick="review('${j.id}','reject')">반려</button>
      </div>`;
  } else if (j.status === 'failed' || j.status === 'cancelled') {
    const e = j.error || {};
    // '3회 시도' 라는 숫자만 있으면 그게 많은 건지 적은 건지 알 수 없다.
    // 어디서 넘어졌고 왜 그렇게 끝났는지를 같이 적는다.
    const why = {
      permanent: `같은 파일로 다시 시도해도 결과가 같은 오류라 재시도하지 않았습니다`,
      exhausted: `일시적인 오류로 보고 ${j.max_attempts}회까지 다시 시도했지만 계속 실패했습니다`,
    }[e.policy] || '';
    const rows = [
      ['단계', e.stage_label || e.stage || '—'],
      ['시도', j.attempts ? `${j.attempts}회` : '—'],
      j.s3_key ? ['입력', j.s3_key] : null,
    ].filter(Boolean);
    body = `<div class="warn">
        <b>${e.title || '실패'}
           ${e.code ? `<span class="tag err" style="float:right">${e.code}</span>` : ''}</b>
        ${e.detail || ''}${e.hint ? `<br><span style="opacity:.8">${e.hint}</span>` : ''}
        ${why ? `<br><span style="opacity:.8">${why}</span>` : ''}
      </div>
      <div class="kv">${rows.map(([k, v]) =>
        `<div><span>${k}</span><b title="${v}">${v}</b></div>`).join('')}</div>`;
  } else {
    // 옛 버전이 쓴 job.json 에는 없는 항목이 있을 수 있다. 카드 하나가
    // 던지면 목록 전체가 안 그려지므로 기본값을 깔고 간다.
    const r = j.result || {}, t = r.timing || {}, v = r.video || {};
    const warns = (r.warnings || []).length
      ? `<div class="warn"><b>확인 필요</b>${
          r.warnings.map(warnText).join('<br>')}</div>` : '';
    body = `<div class="bar2"><i style="width:100%"></i></div>${warns}
      <div class="stats">
        <div><span>처리 시간</span><b>${fmt(r.seconds)}</b></div>
        <div><span>속도</span><b>${r.fps ?? '—'} f/s</b></div>
        <div><span>실시간 대비</span><b>${r.realtime_factor ?? '—'}×</b></div>
        <div><span>프레임</span><b>${r.frames ?? '—'}</b></div>
        <div><span>검출</span><b>${r.raw_boxes ?? '—'}</b></div>
        <div><span>보간</span><b>${r.filled_boxes ?? '—'}</b></div>
      </div>
      <div class="meta" style="margin-top:8px">${j.span || '—'}</div>
      <div class="meta" style="margin-top:4px">검출 ${fmt(t.detect)} · 추적 ${fmt(t.track)}
        · 렌더 ${fmt(t.render)} · ${v.width}×${v.height} · ${r.method || '—'}</div>
      <div class="meta" style="margin-top:6px">${r.s3_output
        ? `결과물 <b>${r.s3_output}</b>` : '결과물은 서버 작업 폴더에 있습니다'}</div>`;
  }
  // 끝난 작업만 지울 수 있다. 대기·수행중은 '취소' 가 따로 있고, 둘을 같은
  // 자리에 두면 무엇이 멈추고 무엇이 사라지는지 구분이 안 된다.
  // 검수 대기는 못 지운다. 판정 전에 지우면 왜 걸렸는지가 같이 사라진다.
  const over = ['done', 'failed', 'cancelled'].includes(j.status);
  const x = over ? `<button class="jx" onclick="del('${j.id}')"
      title="목록에서 지웁니다. S3 의 원본과 결과물은 그대로 남습니다">&times;</button>` : '';
  return `<div class="job ${cls}" id="job-${j.id}">
    <div class="jhead">${x}<div class="jname" title="${j.name}">${j.name}</div>
      <span class="tag ${tagcls}">${label}</span></div>${body}</div>`;
}

// 카드 한 장이 던져도 목록 전체가 사라지면 안 된다. 더 나쁜 것은 그 예외가
// poll() 을 뚫고 나가 **폴링이 멈추는** 것이다 — 화면이 그 시점에 얼어붙는다.
function safeCard(j) {
  try {
    return card(j);
  } catch (e) {
    console.error('카드를 그리지 못했습니다', j && j.id, e);
    return `<div class="job" id="job-${j.id}">
      <div class="jhead"><div class="jname">${j.name || j.id}</div>
        <span class="tag err">표시 오류</span></div>
      <div class="meta">이 작업의 기록을 화면에 옮기지 못했습니다 —
        <a href="/api/jobs/${j.id}">원본 보기</a></div></div>`;
  }
}

// 페이지 막대. 총 건수는 목록이 아니라 집계에서 온다 — 목록은 한 쪽만 안다.
// 한 쪽이 작아 쪽이 수십 개가 되므로 처음·마지막과 쪽 번호 입력을 같이 둔다.
function pager(total) {
  const pages = Math.max(1, Math.ceil(total / pageSize));
  if (pages <= 1) return '';
  const from = page * pageSize + 1, to = Math.min(total, (page + 1) * pageSize);
  const first = page === 0 ? 'disabled' : '', last = page >= pages - 1 ? 'disabled' : '';
  return `<div class="pager">
    <button class="ghost" ${first} onclick="goPage(0)">처음</button>
    <button class="ghost" ${first} onclick="goPage(${page - 1})">이전</button>
    <span>${from}–${to} / ${total}건 ·
      <input type="number" min="1" max="${pages}" value="${page + 1}"
             onchange="goPage(this.value - 1)"> / ${pages} 쪽</span>
    <button class="ghost" ${last} onclick="goPage(${page + 1})">다음</button>
    <button class="ghost" ${last} onclick="goPage(${pages - 1})">마지막</button>
  </div>`;
}

// 전체 취소. **카드의 '취소' 와 같은 자리에 두지 않는다** — 한 건을 멈추는 것과
// 전부를 멈추는 것은 되돌릴 수 없는 정도가 다르다. 목록 밖 오른쪽 끝에 두고,
// 누르면 바로 실행하지 않고 한 번 더 묻는다.
let confirming = false;

function askCancelAll(on) { confirming = on; poll(); }

async function cancelAll() {
  confirming = false;
  const r = await fetch('/api/jobs/cancel-all', { method: 'POST' });
  if (!r.ok) alert(explain(r.status, await r.text()));
  poll();
}

function renderCancelAll(st) {
  const n = counts(st).active || 0;
  const el = $('#jobsact');
  // 끝난 것을 보는 화면(완료·실패·전체 기록)에는 두지 않는다. 그 화면의 카드는
  // 취소할 수 있는 것이 아니라서, 버튼이 무엇을 멈추는지 읽히지 않는다.
  const here = ['active', 'queued'].includes(filter);
  if (!n || !here) { confirming = false; el.innerHTML = ''; return; }
  el.innerHTML = confirming
    ? `<span class="confirm">진행중 ${n}건을 전부 멈춥니다. S3 파일은 그대로입니다.
         <button class="ghost danger" onclick="cancelAll()">전부 멈춤</button>
         <button class="ghost" onclick="askCancelAll(false)">아니오</button></span>`
    : `<button class="ghost danger" onclick="askCancelAll(true)"
               title="대기 전부와 지금 돌고 있는 1건을 멈춥니다">전체 취소</button>`;
}

// 검수 판정. **되돌릴 수 없으니 한 번 묻는다** — 완료로 넘기면 그대로 납품된다.
async function review(id, action) {
  const ask = action === 'approve'
    ? '완료로 넘길까요? 이 영상은 납품 대상이 됩니다.'
    : '반려할까요? 실패로 기록되며, 버킷의 결과물은 지우지 않습니다.';
  if (!confirm(ask)) return;
  const note = action === 'reject'
    ? (prompt('반려 사유 (선택)') || '') : '';
  const r = await fetch('/api/jobs/' + id + '/review', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, note }),
  });
  if (!r.ok) {
    const p = await r.json().catch(() => ({}));
    alert(problemText(p) || '판정을 반영하지 못했습니다');
  }
  poll();
}

// 결과물은 **버킷에 있다.** 우리가 파일을 흘려보내지 않고 위치만 알려 준다 —
// 서버가 스트리밍하면 상태 전환과 로컬 정리 사이의 틈에서 깨지고, GPU 서버가
// 할 일도 아니다. 검수는 봐야 판정할 수 있으니 그 링크를 새 탭에서 연다.
async function watchResult(id) {
  const r = await fetch('/api/jobs/' + id + '/result')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  if (r && r.download_url) window.open(r.download_url, '_blank', 'noopener');
  else alert((r && r.hint) || '결과물 위치를 확인하지 못했습니다');
}

async function del(id) { await fetch('/api/jobs/' + id, { method:'DELETE' }); poll(); }
async function cancel(id) {
  const r = await fetch(`/api/jobs/${id}/cancel`, { method:'POST' });
  if (!r.ok) alert(explain(r.status, await r.text()));
  poll();
}

// **다음 회차 예약은 finally 에서 한다.** 예전에는 함수 맨 끝에 있었는데,
// 중간에 `return` 하는 길이 셋이라 그중 하나만 타면 폴링이 통째로 멎었다.
// 요청이 실패하면(서버 재시작·순간 네트워크 끊김) 화면이 그 자리에서 얼어붙고
// 새로고침 전까지 안 돌아왔다. 바로 아래 safeCard 주석이 걱정하던 그 상황인데
// 정작 이 길은 막혀 있지 않았다.
let pollFails = 0;

function nextPollDelay(busy) {
  // 서버가 죽어 있는 동안 초당 세 번씩 두드릴 이유가 없다. 실패가 이어지면
  // 간격을 늘리되 30초에서 멈춘다 — 서버가 돌아왔을 때 화면이 30초 안에는
  // 살아나야 사람이 '멈췄다' 고 읽지 않는다.
  if (pollFails) return Math.min(1000 * Math.pow(2, pollFails - 1), 30000);
  // **안 보이는 탭은 묻지 않는다.** 운영자는 탭을 켜 둔 채 다른 일을 한다.
  if (document.hidden) return 15000;
  return busy ? 700 : 5000;
}

async function poll() {
  // 거르는 일은 서버가 한다. 잘라 받은 다음 여기서 거르면, 완료가 100건 창
  // 밖에 있을 때 '완료' 탭이 비어 보인다(docs/issues/006).
  //
  // 어느 필터로 요청했는지 붙잡아 둔다. 탭을 누르면 이전 폴링이 아직 날아오는
  // 중이라, 그게 나중에 도착해 방금 고른 탭 위에 옛 목록을 덮어쓴다.
  const asked = filter, askedPage = page;
  const q = ['limit=' + pageSize, asked ? 'status=' + asked : '',
             askedPage ? 'offset=' + askedPage * pageSize : ''].filter(Boolean).join('&');
  const [jobs, st] = await Promise.all([
    fetch('/api/jobs?' + q).then(r => r.json()).catch(() => null),
    fetch('/api/status').then(r => r.json()).catch(() => null),
  ]);
  // 둘 다 못 받았으면 서버가 안 뜬 것이다. 하나라도 오면 실패 수를 되돌린다.
  pollFails = (jobs === null && st === null) ? pollFails + 1 : 0;

  // **다음 회차를 누가 걸 것인가.** 아래에는 다른 폴링 체인에 넘기고 나가는
  // 길이 둘 있다(탭이 바뀐 경우, 빈 쪽에서 물러나는 경우). 그때 여기서도 걸면
  // 체인이 둘이 되어 요청이 두 배로 나간다.
  let busy = false, handedOff = false;
  try {
    // 그 사이 탭이나 쪽이 바뀌었다 — 새 폴링이 그린다
    if (asked !== filter || askedPage !== page) { handedOff = true; return; }
    LAST_STATUS = st;
    paintDev(st);
    hud(jobs || [], st);
    // 팝오버가 열려 있으면 그 안의 모델 상태도 같이 따라간다.
    if (!$('#connpop').hidden && STORAGE) $('#connpop').innerHTML = connPanel(STORAGE);
    if (!jobs) return;
    kpis(jobs, st);
    navCounts(st);
    renderCancelAll(st);
    const c = counts(st);
    if (st && st.page_size) pageSize = st.page_size;
    // 큐 화면은 대기 탭에서만. 탭마다 화면이 실제로 달라야 사이드바가 의미를 갖는다.
    $('#card-queue').hidden = !(filter === 'queued' && view === 'jobs');
    if (!$('#card-queue').hidden) renderQueue(st);
    $('#jobstitle').textContent = FILTER_TEXT[filter] || '전체 기록';
    const total = navCount(st, filter);
    // 큐가 빠지면서 총 건수가 줄면 지금 쪽이 빈 쪽이 된다. 뒤로 물러난다.
    const lastPage = Math.max(0, Math.ceil(total / pageSize) - 1);
    if (page > lastPage) { handedOff = true; return goPage(lastPage); }
    $('#jobcnt').textContent = `${total}건`;
    // 제목이 이미 필터 이름이라 '대기만 ×' 칩은 같은 말을 두 번 하는 셈이다.
    // 되돌아가는 길은 사이드바에 있다.
    $('#jobfilter').hidden = true;
    const html = jobs.length
      ? jobs.map(safeCard).join('') + pager(total)
      : `<div class="empty">${filter === 'active' ? '처리할 작업이 없습니다'
          : filter ? `${FILTER_TEXT[filter]} 상태인 작업이 없습니다` : '작업이 없습니다'}</div>`;
    // 바뀐 게 없으면 다시 그리지 않는다. 0.7초마다 통째로 갈아 끼우면 쪽 번호를
    // 입력하는 중에 포커스가 날아가고, 카드를 읽는 동안 화면이 미세하게 떨린다.
    if (html !== lastJobsHtml) { $('#jobs').innerHTML = html; lastJobsHtml = html; }
    if (view === 'overview' && Date.now() - lastOverview > 10000) loadOverview();
    // 목록을 걸러 보고 있어도 큐가 돌면 빠르게 폴링해야 한다.
    busy = (c.running || 0) + (c.queued || 0) > 0
      || jobs.some(j => j.status === 'running' || j.status === 'queued');
  } finally {
    // **어느 길로 나가든 여기를 지난다.** 그리기 중에 예외가 나도 다음 회차는
    // 걸린다 — 화면이 한 번 잘못 그려지는 것과 영원히 멈추는 것은 다른 일이다.
    if (!handedOff) {
      clearTimeout(timer);
      timer = setTimeout(poll, nextPollDelay(busy));
    }
  }
}

// 탭이 다시 보이면 기다리지 않고 바로 한 번 묻는다 — 돌아왔을 때 옛 화면이
// 15초 동안 남아 있으면 그것도 멈춘 것으로 보인다.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) poll();
});

// 배지는 폴링에서 그린다(paintDev). 예전에는 기동 때 딱 한 번 그려서,
// 모델이 다 올라온 뒤에도 '모델 준비 중' 이 영원히 붙어 있었다.

// 컨트롤 초깃값은 서버에서 받는다. 화면에 박아 두면 서버 설정을 바꿔도
// 화면은 옛 값을 보내서 둘이 조용히 어긋난다.
fetch('/api/defaults').then(r => r.json()).then(d => {
  if (d.method) $('#method').value = d.method;
  if (d.conf != null) $('#conf').value = d.conf;
  if (d.imgsz != null) {
    if (![...$('#imgsz').options].some(o => +o.value === d.imgsz))
      $('#imgsz').add(new Option(d.imgsz, d.imgsz));
    $('#imgsz').value = d.imgsz;
  }
  if (d.batch_size != null) $('#batch').value = d.batch_size;
  if (d.keep_audio != null) $('#audio').checked = !!d.keep_audio;
  $('#dsum').textContent =
    `(기본 ${d.method} · conf ${d.conf} · ${d.imgsz} · batch ${d.batch_size})`;
}).catch(() => { $('#dsum').textContent = '(서버 기본값을 쓰지 못함)'; });

loadCols();
setFilter('active');

// **붙을 곳이 정해지기 전에는 본 화면을 열지 않는다.** 그 상태의 화면은 빈
// 목록과 404 뿐이고, 무엇을 해야 하는지가 어디에도 안 적혀 있다.
//
// 못 물어보면(응답 실패) 그냥 들여보낸다 — 설정 조회 한 번 실패했다고 도구
// 전체를 잠그면, 정작 고칠 수 있는 사람도 못 들어온다.
fetch('/api/storage').then(r => r.ok ? r.json() : null).then(d => {
  if (d && d.first_run) return openSetup(d);
  enterApp();
}).catch(enterApp);
</script>
</body>
</html>
