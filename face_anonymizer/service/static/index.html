<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>face-anonymizer</title>
<style>
  :root{
    /* 흰색 표면 + 파란색 강조. 상태색은 고정 팔레트를 쓰되, 밝은 표면에서는
       대비가 낮은 값이 있어 **글자는 항상 잉크 색**으로 두고 색은 점/테두리로만
       뜻을 거든다. */
    --bg:#f4f7fb; --surface:#ffffff; --raise:#eef4fc; --line:#e2e8f0;
    --fg:#0f172a; --dim:#526075; --faint:#94a3b8;
    --accent:#2a78d6;                     /* 흰 바탕 대비 4.3:1 */
    --accent-ink:#1c5aa8;                 /* 파란 글자용 (더 진한 단계) */
    --accent-dim:#e4eefb;                 /* 같은 램프의 밝은 단계 = 미터 트랙 */
    --accent-sel:#eff5fd;
    --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
    --critical-ink:#a82a2a; --critical-bg:#fdf1f1;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.04);
  }
  *{box-sizing:border-box}
  /* 브라우저 기본값 [hidden]{display:none} 은 우선순위가 0 이라 .card{display:flex}
     한 줄에 진다. 화면 전환이 hidden 으로 되어 있어서, 이게 없으면 '작업' 을
     눌러도 파일 브라우저가 그대로 남는다. */
  [hidden]{display:none !important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
            "Helvetica Neue","Apple SD Gothic Neo","Noto Sans KR",sans-serif}

  /* ── 뼈대 ───────────────────────────────────────────────────────────── */
  .app{display:grid;grid-template-columns:216px 1fr;height:100%}
  .side{background:var(--surface);border-right:1px solid var(--line);
        display:flex;flex-direction:column;min-height:0}
  .brand{padding:18px 18px 14px;font-size:14px;font-weight:600;
         letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .brand .mk{width:20px;height:20px;border-radius:6px;flex:none;
             background:linear-gradient(135deg,#2a78d6,#5b9dff)}
  nav{padding:4px 10px;flex:1;min-height:0;overflow:auto}
  nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
        color:var(--dim);text-decoration:none;font-size:13px;cursor:pointer}
  nav a:hover{background:var(--raise);color:var(--fg)}
  nav a.on{background:var(--accent-dim);color:var(--accent-ink);font-weight:600}
  nav .grp{font-size:10.5px;color:var(--faint);padding:14px 10px 5px;
           letter-spacing:.04em;text-transform:uppercase}
  /* 눌렀을 때 목록이 비어 있으면 아무 일도 안 일어난 것처럼 보인다.
     개수를 옆에 붙여 두면 무엇이 걸러지는지 누르기 전에 안다. */
  nav a .c{margin-left:auto;font-size:11px;color:var(--faint);
           font-variant-numeric:tabular-nums}
  nav a.on .c{color:var(--accent-ink)}
  /* 현황·로그에는 작업 목록이 없다. 그 화면에서 상태가 켜져 있으면 두 곳이
     동시에 선택된 것처럼 보이고, 정작 화면은 어느 쪽도 반영하지 않는다. */
  nav.nolist .st{opacity:.4}
  nav.nolist a.st:hover{opacity:1}

  main{min-width:0;overflow:auto;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:14px;padding:15px 24px;
       border-bottom:1px solid var(--line);position:sticky;top:0;
       background:rgba(255,255,255,.9);backdrop-filter:blur(8px);z-index:10}
  .top h1{font-size:16px;margin:0;font-weight:600;letter-spacing:-.01em;flex:1}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
         color:var(--dim);background:var(--surface);border:1px solid var(--line);
         border-radius:20px;padding:3px 11px;white-space:nowrap}
  /* 연결 표시 — 평소에는 한 줄, 누르면 자세히. */
  .conn{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;
        font-weight:500;color:var(--dim);background:var(--surface);
        border:1px solid var(--line);border-radius:20px;padding:3px 11px;
        white-space:nowrap;cursor:pointer}
  .conn:hover:not(:disabled){background:var(--raise);color:var(--accent-ink);
        border-color:#cfe0f6}
  .conn .dot{width:7px;height:7px;border-radius:50%;background:var(--good);
        box-shadow:0 0 0 3px rgba(12,163,12,.16)}
  .conn.off .dot{background:var(--faint);box-shadow:none}
  #connpop{position:absolute;right:24px;top:56px;z-index:20;width:380px;
        background:var(--surface);border:1px solid var(--line);border-radius:12px;
        box-shadow:0 10px 34px rgba(15,23,42,.13);padding:16px 18px}
  #connpop .kv{margin:0}
  .content{padding:20px 24px 32px;display:flex;flex-direction:column;gap:18px}

  /* ── KPI 타일 ───────────────────────────────────────────────────────── */
  .kpis{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:12px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;
        padding:15px 16px;min-width:0;box-shadow:var(--shadow)}
  .tile .lb{font-size:11.5px;color:var(--dim);margin-bottom:6px}
  .tile .v{font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
  .tile.hero{background:linear-gradient(180deg,#f7fbff,#ffffff);
             border-color:#cfe0f6}
  .tile.hero .lb{color:var(--accent-ink)}
  .tile.hero .v{font-size:44px;letter-spacing:-.03em;line-height:1.05;
                color:var(--accent-ink)}
  .tile .sub{font-size:11.5px;color:var(--faint);margin-top:5px}
  .tile .v small{font-size:14px;font-weight:500;color:var(--dim);margin-left:3px}

  /* ── 카드 ───────────────────────────────────────────────────────────── */
  .grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);
         gap:18px;align-items:start}
  .grid2.solo{grid-template-columns:minmax(0,1fr)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
        min-width:0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .card > h2{font-size:12.5px;margin:0;font-weight:600;color:var(--dim);
             padding:14px 16px;border-bottom:1px solid var(--line);
             display:flex;align-items:center;gap:9px}
  .card > h2 .cnt{margin-left:auto;font-weight:500;color:var(--faint);font-size:11.5px}
  /* 사이드바에서 무엇을 걸렀는지 목록 쪽에도 적는다. 왼쪽만 강조돼 있으면
     오른쪽 목록이 왜 짧아졌는지 연결이 안 된다. */
  .chip{display:inline-flex;align-items:center;gap:6px;margin-left:8px;
        background:var(--accent-dim);color:var(--accent-ink);border-radius:99px;
        padding:2px 6px 2px 9px;font-size:11px;font-weight:600}
  .chip b{cursor:pointer;font-size:13px;line-height:1;opacity:.7}
  .chip b:hover{opacity:1}
  /* ── 현황 ───────────────────────────────────────────────────────────── */
  .prow{padding:11px 0;border-bottom:1px solid #f1f5f9}
  .prow:last-child{border-bottom:0}
  .prow .t{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
  .prow .t b{font-weight:600}
  .prow .t span{margin-left:auto;color:var(--dim);font-size:11.5px;
                font-variant-numeric:tabular-nums}
  .track{height:7px;background:var(--accent-dim);border-radius:99px;
         overflow:hidden;margin-top:7px}
  .track>i{display:block;height:100%;background:var(--accent)}
  .track.full>i{background:var(--good)}
  .ops{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .ops div{background:var(--bg);border-radius:8px;padding:9px 11px}
  .ops span{display:block;color:var(--faint);font-size:10.5px;margin-bottom:3px}
  .ops b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .ops b small{font-size:11px;color:var(--dim);font-weight:500;margin-left:3px}
  .ops .wide{grid-column:1/-1}
  .ops .warnv b{color:var(--critical)}
  .card .pad{padding:14px 16px}

  /* ── S3 브라우저 ────────────────────────────────────────────────────── */
  .bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
       padding:12px 16px;border-bottom:1px solid var(--line)}
  .crumb{display:flex;align-items:center;gap:5px;font-size:12.5px;min-width:0;flex:1}
  .crumb a{color:var(--accent-ink);text-decoration:none;cursor:pointer;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb a:hover{text-decoration:underline}
  .crumb .sep{color:var(--faint);flex:none}
  .crumb .cur{color:var(--fg);font-weight:600;white-space:nowrap}
  .divider{width:1px;height:18px;background:var(--line);flex:none}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;
          color:var(--dim);cursor:pointer;white-space:nowrap;margin:0}
  .toggle:hover{color:var(--fg)}
  .toggle input{margin:0}
  .search{position:relative;flex:none}
  .search input{background:var(--bg);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:6px 10px 6px 26px;font-size:12.5px;width:170px}
  .search input:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-dim)}
  .search::before{content:'\2315';position:absolute;left:8px;top:5px;
                  color:var(--faint);font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{text-align:left;font-weight:600;font-size:11px;color:var(--faint);
           padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap;
           letter-spacing:.02em;background:#fafcfe}
  tbody td{padding:8px 16px;border-bottom:1px solid #f1f5f9}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#f8fbff}
  tbody tr.sel{background:var(--accent-sel)}
  td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim);
         white-space:nowrap}
  td.when{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
  .key{display:flex;align-items:center;gap:8px;min-width:0}
  .key .ico{flex:none;width:14px;text-align:center;color:var(--accent);font-size:11px}
  .key .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .key a{color:var(--accent-ink);text-decoration:none;cursor:pointer;font-weight:500}
  .key a:hover{text-decoration:underline}
  /* 상태 배지: 색은 점이 나르고 글자는 잉크 색으로 둔다 (밝은 표면 대비) */
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;
       padding:2px 8px;border-radius:20px;border:1px solid var(--line);
       color:var(--dim);white-space:nowrap;background:var(--surface)}
  .tag::before{content:'';width:5px;height:5px;border-radius:50%;
               background:var(--faint);flex:none}
  .tag.done{border-color:#bfe3bf}   .tag.done::before{background:var(--good)}
  .tag.run{border-color:#cfe0f6;color:var(--accent-ink)}
  .tag.run::before{background:var(--accent)}
  .tag.err{border-color:#f2c9c9;color:var(--critical-ink)}
  .tag.err::before{background:var(--critical)}
  .tag.warnt{border-color:#f5dda1;color:#8a6100}
  .tag.warnt::before{background:var(--warning)}
  .tag.plain::before{display:none}
  .empty{text-align:center;color:var(--faint);padding:38px 16px;font-size:12.5px}

  /* 상세 설정용 select 는 width:100% 라 바 안에서는 줄을 통째로 먹는다. */
  .bar select{width:auto;font-size:12px;padding:5px 8px}

  /* 로그 게시판. 표가 아니라 줄이다 — 한 줄이 사건 하나이고, 눈이 시각을 따라
     세로로 내려가야 해서 앞 세 칸의 폭을 고정한다. */
  .bar input.dt{background:var(--bg);border:1px solid var(--line);
                color:var(--fg);border-radius:8px;padding:4px 8px;
                font-size:12px;font-family:inherit;width:auto}
  .bar input.dt:focus{outline:none;border-color:var(--accent)}
  .bchip{font-size:11.5px;padding:3px 9px;border-radius:20px;cursor:pointer;
         border:1px solid var(--line);color:var(--dim);background:var(--surface)}
  .bchip:hover{border-color:var(--accent);color:var(--accent-ink)}
  .bchip.on{background:var(--accent-dim);border-color:var(--accent);
            color:var(--accent-ink);font-weight:600}
  .lrow{display:flex;align-items:baseline;gap:10px;padding:7px 16px;
        border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
  .lrow:hover{background:var(--accent-sel)}
  .lrow .lt{font-variant-numeric:tabular-nums;color:var(--faint);
            font-size:11.5px;width:60px;flex:none}
  .lrow .lm{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;
            color:var(--faint);border:1px solid var(--line);border-radius:4px;
            padding:0 4px;width:34px;text-align:center;flex:none}
  .lrow .lm.msa{color:var(--accent-ink);border-color:var(--accent)}
  .lrow .lb{width:64px;flex:none;font-weight:600;font-size:11.5px;
            display:flex;align-items:center;gap:5px}
  .lrow .lb::before{content:'';width:6px;height:6px;border-radius:50%;
                    background:var(--faint);flex:none}
  .lrow .lb.ok::before{background:var(--good)}
  .lrow .lb.bad::before{background:var(--critical)}
  .lrow .lb.warn::before{background:var(--warning)}
  .lrow .lb.run::before{background:var(--accent)}
  .lrow .ln{color:var(--fg);white-space:nowrap;overflow:hidden;
            text-overflow:ellipsis;max-width:300px}
  /* 요약 열을 끄면 파일명이 남은 폭을 쓴다. 안 그러면 오른쪽이 통째로 빈다. */
  .lrow:not(:has(.lx)) .ln{max-width:none;flex:1;min-width:0}
  .lrow .lg2{margin-left:auto}
  .lrow .lx{color:var(--dim);flex:1;min-width:0;overflow:hidden;
            text-overflow:ellipsis;white-space:nowrap}
  .lrow .lg2{color:var(--faint);font-size:11px;flex:none}
  .lrow .lcv{color:var(--faint);font-size:9px;width:10px;flex:none;
             transition:transform .12s}
  .lrow.open .lcv{transform:rotate(90deg);color:var(--accent-ink)}
  .lrow.open{background:var(--accent-sel)}
  .ldet{padding:10px 16px 14px 88px;border-bottom:1px solid var(--line);
        background:var(--accent-sel);font-size:12px}
  .ldet .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
            gap:6px 14px;margin-bottom:8px}
  .ldet .kv > div{display:flex;gap:6px;min-width:0}
  .ldet .kv span{color:var(--faint);flex:none}
  .ldet .kv b{color:var(--fg);font-weight:600;overflow:hidden;
              text-overflow:ellipsis;white-space:nowrap}
  .ldet pre{margin:0;padding:8px 10px;background:var(--surface);
            border:1px solid var(--line);border-radius:8px;overflow:auto;
            font-size:11px;color:var(--dim);max-height:220px}
  /* 작업 단위로 묶었을 때의 머리줄. 게시판의 '글' 에 해당한다. */
  .lhead{display:flex;align-items:baseline;gap:9px;padding:9px 16px 6px;
         background:var(--raise);border-top:1px solid var(--line);
         font-size:12.5px;font-weight:600}
  .lhead .sub{font-weight:400;color:var(--dim);font-size:11.5px}
  .lhead .sub.bad{color:var(--critical-ink)}
  .lgroup .lrow{padding-left:28px;border-bottom:1px dashed var(--line)}
  /* 묶으면 파일명이 머리줄에 이미 있다. 줄마다 또 쓰면 눈이 그걸 읽느라 정작
     달라지는 값(사건·수치)을 늦게 찾는다. */
  .lgroup .lrow .ln{display:none}
  .pager{display:flex;align-items:center;justify-content:center;gap:12px;
         padding:14px 16px;border-top:1px solid var(--line);
         color:var(--dim);font-size:12.5px}
  .pager button[disabled]{opacity:.4;cursor:default}
  .pager input{width:52px;text-align:center;padding:4px 6px;font-size:12.5px;
               border:1px solid var(--line);border-radius:7px;background:var(--surface)}
  /* 위험한 동작은 목록 밖, 오른쪽 끝에 따로 둔다 — 카드의 '취소' 와 섞이면 안 된다 */
  .danger{border-color:#f2c9c9;color:var(--critical-ink)}
  .danger:hover{background:#fdf2f2}
  .confirm{display:inline-flex;align-items:center;gap:7px;font-size:12px;
           color:var(--critical-ink)}

  /* ── 큐 UI ──────────────────────────────────────────────────────────── */
  .flow{display:grid;grid-template-columns:1fr 26px 1fr 26px 1fr;align-items:stretch;
        gap:0;padding:4px 0 2px}
  .flow .box{border:1px solid var(--line);border-radius:11px;padding:13px 15px;
             background:var(--raise);min-width:0}
  .flow .box.mid{background:var(--accent-sel);border-color:#cfe0f6}
  .flow .lb{font-size:11px;color:var(--dim);letter-spacing:.02em}
  .flow .v{font-size:21px;font-weight:650;margin:3px 0 1px;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flow .sub{font-size:11.5px;color:var(--faint);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flow .arw{display:flex;align-items:center;justify-content:center;
             color:var(--faint);font-size:15px}
  .nextup{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;
          padding-top:12px;border-top:1px solid var(--line)}
  .nextup span{font-size:11.5px;color:var(--dim);background:var(--raise);
               border:1px solid var(--line);border-radius:7px;padding:3px 8px}
  .nextup .hd{background:none;border:none;color:var(--faint);padding-left:0}
  .bar .n{font-size:12.5px;color:var(--dim);margin-left:auto;white-space:nowrap}
  .bar .n b{color:var(--fg)}

  /* ── 폼 ─────────────────────────────────────────────────────────────── */
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:11px}
  details > summary{cursor:pointer;font-size:12px;color:var(--dim);
                    list-style:none;display:flex;align-items:center;gap:7px}
  details > summary::before{content:'▸';color:var(--faint);font-size:10px}
  details[open] > summary::before{content:'▾'}
  details > summary:hover{color:var(--accent-ink)}
  details > summary #dsum{color:var(--faint);font-size:11.5px}
  label{display:block;font-size:11px;color:var(--faint);margin-bottom:4px}
  select,input[type=number]{width:100%;background:var(--surface);color:var(--fg);
    border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px}
  select:focus,input[type=number]:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-dim)}
  .chk{display:flex;align-items:center;gap:7px;font-size:12.5px;padding-top:18px;
       color:var(--dim)}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;
    padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  button:hover:not(:disabled){background:var(--accent-ink)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:var(--surface);color:var(--dim);
               border:1px solid var(--line);font-weight:500}
  button.ghost:hover:not(:disabled){background:var(--raise);color:var(--accent-ink);
    border-color:#cfe0f6}
  input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
  /* 첫 실행 설정 — 아직 아무것도 없는 사람이 처음 보는 화면이다. */
  .stin{width:100%;background:var(--surface);color:var(--fg);
    border:1px solid var(--line);border-radius:7px;padding:6px 8px;
    font-size:12.5px;font-family:inherit}
  .stin:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-dim)}
  .stgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .stgrid .wide{grid-column:1/-1}

  /* ── 작업 목록 ──────────────────────────────────────────────────────── */
  .job{padding:13px 16px;border-bottom:1px solid #f1f5f9}
  .job:last-child{border-bottom:0}
  .jhead{display:flex;align-items:baseline;gap:9px}
  /* 목록에서만 지우는 것이라 '삭제' 라고 쓰면 S3 원본을 지우는 것으로 읽힌다.
     라벨 없는 x 로 두고 설명은 툴팁에 둔다. */
  .jx{flex:none;border:0;background:none;cursor:pointer;padding:0 2px;
      font-size:15px;line-height:1;color:var(--faint)}
  .jx:hover{color:var(--critical)}
  .jname{font-weight:600;font-size:12.5px;overflow:hidden;
         text-overflow:ellipsis;white-space:nowrap;flex:1}
  .bar2{height:6px;background:var(--accent-dim);border-radius:99px;
        overflow:hidden;margin:9px 0 7px}
  .bar2>i{display:block;height:100%;background:var(--accent);width:0;
          border-radius:99px;transition:width .35s ease}
  .job.ok .bar2>i{background:var(--good)}
  .meta{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
  .stats div{background:var(--bg);border-radius:7px;padding:6px 8px}
  .kv{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .kv div{background:var(--bg);border-radius:7px;padding:6px 9px;min-width:0}
  .kv span{color:var(--faint);font-size:10.5px;margin-right:6px}
  .kv b{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
        white-space:nowrap;display:inline-block;max-width:340px;vertical-align:bottom}
  .stats span{display:block;color:var(--faint);font-size:10.5px}
  .stats b{font-size:12.5px;font-weight:600}
  .warn{background:var(--critical-bg);border:1px solid #f2c9c9;border-radius:8px;
        padding:9px 11px;margin-top:10px;color:var(--critical-ink);
        font-size:11.5px;line-height:1.5}
  .warn b{display:block;margin-bottom:2px}
  .row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}

  /* ── 좌측 하단 상태 박스 ────────────────────────────────────────────── */
  .hud{border-top:1px solid var(--line);padding:13px 14px;flex:none;background:#fafcfe}
  .hud .hd{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .hud .hd h3{font-size:11.5px;margin:0;font-weight:600;flex:1;letter-spacing:-.01em}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .dot.ok{background:var(--good);box-shadow:0 0 0 3px rgba(12,163,12,.14)}
  .dot.run{background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);
           animation:pulse 1.5s ease-in-out infinite}
  .dot.warn{background:var(--warning);box-shadow:0 0 0 3px rgba(250,178,25,.18)}
  .dot.err{background:var(--critical);box-shadow:0 0 0 3px rgba(208,59,59,.14)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .ringwrap{position:relative;display:flex;align-items:center;justify-content:center;
            flex:none}
  .ringwrap .pct{position:absolute;font-size:12.5px;font-weight:600;
                 color:var(--accent-ink)}
  .ring{display:flex;align-items:center;gap:12px}
  .ring svg{transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:5;stroke-linecap:round}
  .ring .trk{stroke:var(--accent-dim)}
  .ring .fil{stroke:var(--accent);transition:stroke-dasharray .4s ease}
  .who{min-width:0;flex:1}
  .who .nm{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
           white-space:nowrap;margin-bottom:2px}
  .who .st{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .chip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;
        border:1px solid var(--line);color:var(--faint);margin-right:4px;
        background:var(--surface)}
  .chip.on{color:var(--accent-ink);border-color:#cfe0f6;background:var(--accent-dim)}
  .hgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:11px}
  .hgrid div{background:var(--surface);border:1px solid var(--line);
             border-radius:7px;padding:6px 8px}
  .hgrid span{display:block;color:var(--faint);font-size:10px}
  .hgrid b{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .idle{color:var(--faint);font-size:11.5px;text-align:center;padding:4px 0 2px}

  @media (max-width:1080px){
    .kpis{grid-template-columns:1fr 1fr}
    .grid2{grid-template-columns:minmax(0,1fr)}
  }
  @media (max-width:760px){ .app{grid-template-columns:1fr} .side{display:none} }

  /* ── 첫 실행 관문 ───────────────────────────────────────────────────── */
  #setup{position:fixed;inset:0;background:var(--bg);overflow:auto;
         display:flex;align-items:flex-start;justify-content:center;padding:48px 20px}
  .setup-box{width:100%;max-width:620px;background:var(--surface);
             border:1px solid var(--line);border-radius:14px;

  .setup-head{margin-bottom:22px}
  .setup-head .brand{padding:0;margin-bottom:10px;font-size:15px}
  .setup-head p{margin:0;font-size:13px;color:var(--dim);line-height:1.65}
</style>
</head>
<body>
<!-- 첫 실행 관문. **정하기 전에는 아무 화면도 안 보여 준다.**
     예전에는 설정 카드가 현황 화면 안에 다른 카드들과 나란히 있었다. 그러면
     아직 붙을 곳이 없는데 진척률·큐·자원이 0 으로 채워져 나오고, 사이드바의
     탭들은 눌러도 빈 화면과 404 뿐이다. 지금 할 수 있는 일이 하나뿐이면
     화면에 그것만 있어야 한다. -->
<div id="setup" hidden>
  <div class="setup-box">
    <div class="setup-head">
      <div class="brand"><span class="mk"></span>face-anonymizer</div>
      <p>시작하려면 <b>어디에 붙을지</b> 정해 주세요. 영상을 여기서 읽고
         결과를 여기에 씁니다.</p>
    </div>
    <div id="setup-body"><div class="empty">불러오는 중…</div></div>
  </div>
</div>

<div class="app" hidden>
  <aside class="side">
    <div class="brand"><span class="mk"></span>face-anonymizer</div>
    <nav>
      <div class="grp">화면</div>
      <a onclick="go2('overview')" id="tab-overview">현황</a>
      <a onclick="go2('browser')" id="tab-browser">파일 브라우저</a>
      <a onclick="go2('jobs')" id="tab-jobs">작업<span class="c" id="c-jobs"></span></a>
      <a onclick="go2('logs')" id="tab-logs">로그</a>
      <div class="grp st">작업 상태</div>
      <a onclick="setFilter('active')" id="nav-active" class="st on">진행중<span class="c"></span></a>
      <a onclick="setFilter('queued')" id="nav-queued" class="st">대기<span class="c"></span></a>
      <a onclick="setFilter('review')" id="nav-review" class="st">검수<span class="c"></span></a>
      <a onclick="setFilter('done')" id="nav-done" class="st">완료<span class="c"></span></a>
      <a onclick="setFilter('failed')" id="nav-failed" class="st">실패<span class="c"></span></a>
      <a onclick="setFilter('')" id="nav-all" class="st">전체 기록<span class="c"></span></a>
    </nav>
    <div class="hud">
      <div class="hd">
        <span class="dot" id="hdot"></span>
        <h3 id="htitle">연결 중…</h3>
      </div>
      <div id="hbody"></div>
    </div>
  </aside>

  <main>
    <div class="top">
      <h1 id="page">파일 브라우저</h1>
      <!-- 어디에 붙어 있나. **카드 하나를 통째로 쓸 일이 아니다** — 평소에는
           "어디에 붙어 있는지" 한 줄이면 되고, 자세한 것은 눌렀을 때 나오면
           된다. 현황 화면에 카드로 두면 그 화면에서만 보이는 것도 문제였다. -->
      <button class="conn" id="conn" onclick="toggleConn()" hidden></button>
      <span class="badge" id="dev">—</span>
    </div>
    <div id="connpop" hidden></div>

    <div class="content">
      <div class="kpis" id="kpis"></div>

      <!-- 현황 -->
      <section class="view" id="view-overview" hidden>
        <div class="grid2">
          <section class="card">
            <h2>폴더별 진척률
              <span class="cnt" id="progsum"></span></h2>
            <div id="prog" class="pad"><div class="empty">불러오는 중…</div></div>
          </section>
          <section class="card">
            <h2>큐 · 자원</h2>
            <div id="opsbody" class="pad"></div>
          </section>
        </div>

        <!-- 폴더 단위 시작·종료. 파일 카드에서는 읽어 낼 수 없는 값이다. -->
        <section class="card" id="card-batches" hidden style="margin-top:14px">
          <h2>폴더별 처리 시각</h2>
          <div id="batches"></div>
        </section>
      </section>

      <!-- 로그 -->
      <section class="view" id="view-logs" hidden>
        <section class="card">
          <div class="bar">
            <select id="lgevent">
              <option value="">전체 사건</option>
              <option value="job.finished">완료</option>
              <option value="job.failed">실패</option>
              <option value="job.started">시작</option>
              <option value="job.retry">재시도</option>
              <option value="job.cancelled">취소</option>
              <option value="worker.">워커</option>
            </select>
            <select id="lgmode">
              <option value="">api · msa 전부</option>
              <option value="api">api (우리 서버)</option>
              <option value="msa">msa (큐 워커)</option>
            </select>
            <div class="search"><input id="lgq" placeholder="파일명 · 폴더로 검색"
                                       autocomplete="off"></div>
            <label class="toggle"><input type="checkbox" id="lggroup">
              <span>작업 단위로 묶기</span></label>
            <label class="toggle"><input type="checkbox" id="lglive" checked>
              <span>자동 갱신</span></label>
            <span class="n" id="lgnote"></span>
            <button class="ghost" onclick="loadLogs()">새로고침</button>
            <button class="ghost" onclick="exportLogs()">내보내기</button>
          </div>
          <!-- 폴더 고르기. 아무것도 안 고르면 전체, 하나면 단일, 여럿이면 다중.
               따로 화면을 두지 않는 이유는 **보이는 것과 받는 것이 같아야** 해서다 —

          <div class="bar" id="lgbatches" hidden
               style="border-top:0;padding-top:0"></div>
          <!-- 기간. 양 끝을 포함하고, 해석은 서버가 한다 — 화면이 브라우저
               타임존으로 계산하면 다른 지역에서 열었을 때 저널의 그 날짜와
               다른 구간을 가리킨다. -->
          <!-- 화면에 그릴 열. **표현 단위이지 조건이 아니다** — 열을 꺼도
               받아 오는 줄은 그대로이고, 내보내기는 조건(사건·폴더·기간·검색)만
               따라간다. 화면은 좁고 CSV 는 넓어서 같은 단위로 묶으면 한쪽이
               반드시 아쉬워진다. -->
          <div class="bar" id="lgcols" style="border-top:0;padding-top:0"></div>

            <span class="bchip" onclick="pickDays(7)">최근 7일</span>
            <span class="bchip" onclick="pickDays(30)">최근 30일</span>
            <span class="bchip" onclick="pickDays(null)">전체</span>
            <span class="n" id="lgdaysum"></span>
          </div>
          <div id="logs"><div class="empty">불러오는 중…</div></div>
        </section>
      </section>

      <!-- 파일 브라우저 · 작업 -->
      <div class="grid2" id="view-work">
        <section class="card" id="card-browser">
          <div class="bar">
            <div class="crumb" id="crumb"></div>
            <div class="search"><input id="q" placeholder="이름으로 검색" autocomplete="off"></div>
            <button class="ghost" onclick="loadObjects()">새로고침</button>
            <span class="divider"></span>
            <label class="toggle"><input type="checkbox" id="skipdone" checked><span>처리된 건 건너뛰기</span></label>
            <span class="n" id="picked">선택된 항목 없음</span>
            <button id="go" disabled>비식별화 시작</button>
          </div>
          <div id="browser"></div>
          <details class="pad" style="border-top:1px solid var(--line)">
            <summary>상세 설정 <span id="dsum"></span></summary>
            <div class="opts" style="margin-top:12px">
              <div><label>익명화 방식</label>
                <select id="method">
                  <option value="mosaic">모자이크</option>
                  <option value="blur">블러</option>
                  <option value="box">단색 박스</option>
                </select></div>
              <div><label>검출 임계값</label>
                <input type="number" id="conf" value="0.25" min="0.05" max="0.95" step="0.05"></div>
              <div><label>추론 해상도</label>
                <select id="imgsz">
                  <option value="960">960</option>
                  <option value="1280" selected>1280</option>
                  <option value="1600">1600</option>
                </select></div>
              <div><label>배치 크기</label>
                <input type="number" id="batch" value="16" min="1" max="64"></div>
              <div class="chk"><input type="checkbox" id="audio" checked><span>오디오 유지</span></div>
            </div>
          </details>

        <!-- 큐 화면. 무엇이 들어와 있고, 무엇이 돌고, 무엇이 나갔나. -->
        <section class="card" id="card-queue" hidden>
          <h2>큐<span class="cnt" id="queuesub"></span></h2>
          <div id="queueui"></div>
        </section>

          <h2><span id="jobstitle">작업</span>
            <span class="chip" id="jobfilter" hidden></span>
