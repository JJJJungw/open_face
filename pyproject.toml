[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "face-anonymizer"
version = "0.2.0"
description = "YOLO-FaceV2 + ByteTrack 기반 영상 얼굴 비식별화 (모자이크/블러/박스)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "torch>=1.13",
    "torchvision>=0.14",
    "opencv-python>=4.7",
    "numpy>=1.23",
    "supervision>=0.18,<0.30",
]

# torch 는 일부러 뺐다 — 테스트는 가짜 검출기를 주입하므로 2GB 짜리 torch
# 없이도 파이프라인 전 구간을 검증한다. (tests/conftest.py 참고)
[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "opencv-python>=4.7",
    "numpy>=1.23",
    "supervision>=0.18,<0.30",
]

[project.scripts]
face-anonymize = "face_anonymizer.cli:main"

[tool.setuptools]
packages = ["face_anonymizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # supervision 0.29 의 ByteTrack deprecation. 상한(<0.30)을 걸어 뒀으므로
    # 교체 전까지는 소음으로만 취급한다.
    "ignore:The `ByteTrack` was deprecated:FutureWarning",
]
