[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "face-anonymizer"
version = "0.2.0"
description = "YOLO-FaceV2 + ByteTrack 기반 영상 얼굴 비식별화 (모자이크/블러/박스)"
readme = "README.md"
# **3.11 로 못 박는다.** 붙을 곳(rebornstudio)이 저장소 전체를 `>=3.11,<3.12` 로
# 묶어 두었고 워커 이미지가 `python:3.11-slim` 이다. 우리는 별도 서버라 기술적으로는
# 아무 버전이나 써도 되지만, **개발과 배포가 다른 파이썬에서 도는 것이 실제로 우리를
# 물었다** — 3.12 에서 임포트 훅이 제거되면서 검사 하나가 조용히 아무것도 안 보게
# 됐다(docs/issues/026). 상한을 열어 두면 그 종류의 어긋남이 또 생긴다.
#
# 같은 값이 `.python-version` 에도 있다. 둘이 갈라지지 않는지는
# tests/test_env.py 가 본다.
requires-python = ">=3.11,<3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "torch>=1.13",
    "torchvision>=0.14",
    "opencv-python>=4.7",
    "numpy>=1.23",
    "supervision>=0.18,<0.30",
]

# torch 는 일부러 뺐다 — 테스트는 가짜 검출기를 주입하므로 2GB 짜리 torch
# 없이도 파이프라인 전 구간을 검증한다. (tests/conftest.py 참고)
[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "opencv-python>=4.7",
    "numpy>=1.23",
    "supervision>=0.18,<0.30",
]

[project.scripts]
face-anonymize = "face_anonymizer.cli:main"

[tool.setuptools]
packages = [
    "face_anonymizer",
    "face_anonymizer.core",      # 영상 처리 (서버·S3 없이 돈다)
    "face_anonymizer.service",   # HTTP API · 웹 UI · 지표
    "face_anonymizer.storage",   # 저장소 입출력 · 이름 규칙
    "face_anonymizer.msa",       # 큐를 지켜보는 워커 (인바운드 포트 없음)
]

# 웹 UI 는 static/index.html 파일 하나다. 빠지면 서버가 기동에서 터진다.
[tool.setuptools.package-data]
"face_anonymizer.service" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # supervision 0.29 의 ByteTrack deprecation. 상한(<0.30)을 걸어 뒀으므로
    # 교체 전까지는 소음으로만 취급한다.
    "ignore:The `ByteTrack` was deprecated:FutureWarning",
]
