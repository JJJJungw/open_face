[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "face-anonymizer"
version = "0.1.0"
description = "YOLO-FaceV2 + ByteTrack 기반 영상 얼굴 비식별화 (모자이크/블러/박스)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "torch>=1.13",
    "torchvision>=0.14",
    "opencv-python>=4.7",
    "numpy>=1.23",
    "supervision>=0.18",
]

[project.scripts]
face-anonymize = "face_anonymizer.cli:main"

[tool.setuptools]
packages = ["face_anonymizer"]
